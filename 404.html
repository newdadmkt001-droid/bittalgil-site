
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="개인회생 변제금을 1분 만에 진단합니다. 법무법인 현암이 직접 검토합니다.">
<meta name="theme-color" content="#0B0D10">
<link rel="canonical" href="https://bittalgil.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="빚탈길">
<meta property="og:title" content="빚탈길 — 내 빚, 얼마나 줄어들까">
<meta property="og:description" content="개인회생 변제금을 1분 만에 진단합니다. 법무법인 현암이 직접 검토합니다.">
<meta property="og:url" content="https://bittalgil.com/">
<meta property="og:image" content="https://bittalgil.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>빚탈길 — 개인회생 변제금 진단</title>
<style>
  

  /* ══════════════════════════════════════════════════════════════
     빚탈길 디자인 시스템 — 라이트
     근거: docs/blueprint.md · docs/teardown/ 11개 실측 보고서
     색은 전부 대비를 재서 통과한 값이다(흰 지면 / 스테이지 #F2F4F6 양쪽).
     ══════════════════════════════════════════════════════════════ */
  :root{
    --bg:#FFFFFF; --stage:#F2F4F6; --card:#FFFFFF;
    --t1:#191F28;      /* 제목 16.56:1 */
    --t2:#333D4B;      /* 본문 11.00:1 */
    --t3:#646B74;      /* 보조·법정고지 5.39 / 4.89:1 */
    --t4:#8B95A1;      /* 장식·비활성 3.04:1 — 텍스트에 쓰지 않는다 */
    --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.13);
    --brand:#3182F6;      /* 면·바·강조. 작은 글자에 쓰지 않는다(3.71:1) */
    --brand-ink:#286BCA;  /* 본문 링크·작은 글자 5.19:1 */
    --ok:#15803D; --warn:#B91C1C;

    --fs-b:16px; --fs-m:14px;
    --ls:-.02em;
    --lh1:1.2; --lh2:1.28; --lh3:1.4; --lh4:1.48; --lh5:1.6;

    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
    --s7:28px;--s8:32px;--s9:44px;--s10:56px;--s11:64px;--s12:80px;
    --pad:20px; --sec:56px; --gapblock:88px;

    --r-sm:6px; --r:16px; --r-lg:22px; --r-xl:32px; --r-pill:999px;

    --t-fast:.15s; --t-press:.2s; --t-slow:.3s; --t-in:.5s; --t-draw:1.1s;
    --e-in:cubic-bezier(.25,.46,.45,.94); --e-st:cubic-bezier(.4,0,.2,1);
    --spring:cubic-bezier(.34,1.56,.64,1);

    --lift:0 8px 24px rgba(19,32,60,.10);
    --lift-lg:0 22px 48px rgba(19,32,60,.14);
    --w-page:1280px; --w-read:560px; --w-art:720px; --w-tab:620px;
  }
  @media (min-width:640px){:root{--pad:32px;--sec:72px;--gapblock:104px}}
  @media (min-width:1025px){:root{--pad:56px;--sec:96px;--gapblock:140px}}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;letter-spacing:var(--ls)}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--t2);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;
    font-size:var(--fs-b);font-weight:500;line-height:var(--lh5);word-break:keep-all;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  svg{display:block}
  button,input,select,textarea{font-family:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;color:inherit}
  img{max-width:100%}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--brand-ink)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

  /* ── 타입 사다리 ── */
  .d1{font-size:32px;font-weight:800;color:var(--t1);line-height:1.24;letter-spacing:-.035em}
  .d2{font-size:26px;font-weight:800;color:var(--t1);line-height:var(--lh2);letter-spacing:-.035em}
  .d3{font-size:20px;font-weight:800;color:var(--t1);line-height:var(--lh3);letter-spacing:-.03em}
  .bd{font-size:var(--fs-b);font-weight:500;color:var(--t2);line-height:var(--lh5)}
  .cap{font-size:var(--fs-m);font-weight:500;color:var(--t3);line-height:var(--lh5)}
  .kick{font-size:var(--fs-m);font-weight:800;color:var(--brand-ink)}
  @media (min-width:640px){.d1{font-size:44px}.d2{font-size:30px}}
  @media (min-width:1025px){.d1{font-size:56px;letter-spacing:-.04em}.d2{font-size:36px}.d3{font-size:20px}}

  .wrap{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad);width:100%}
  @media (min-width:640px){.wrap{max-width:var(--w-tab)}}
  @media (min-width:1025px){.wrap{max-width:var(--w-page)}}
  .stack{display:flex;flex-direction:column;gap:var(--s6)}
  .sec{padding:var(--sec) 0 0}

  /* ── 진입 리빌 — 이동거리는 요소 크기에 비례한 4단 ── */
  .rv{opacity:0;transform:translateY(var(--rv-d,24px));
      transition:opacity var(--t-in) var(--e-in),transform var(--t-in) var(--e-in)}
  .rv.d1t{--rv-d:16px}.rv.d2t{--rv-d:24px}.rv.d3t{--rv-d:40px}.rv.d4t{--rv-d:64px}
  .rv.shown{opacity:1;transform:none}
  .seq > *{opacity:0;transform:translateY(16px)}
  .seq.nomo > *{opacity:1;transform:none;animation:none}
  .seq.go > *{animation:pop .7s var(--e-in) forwards}
  .seq.go > *:nth-child(1){animation-delay:0s}.seq.go > *:nth-child(2){animation-delay:.1s}
  .seq.go > *:nth-child(3){animation-delay:.2s}.seq.go > *:nth-child(4){animation-delay:.3s}
  .seq.go > *:nth-child(5){animation-delay:.4s}.seq.go > *:nth-child(6){animation-delay:.5s}
  @keyframes pop{to{opacity:1;transform:none}}

  /* ── C10 CTA · 버튼 ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
    min-height:52px;padding:var(--s4) var(--s7);border-radius:var(--r);border:0;cursor:pointer;
    background:var(--t1);color:#fff;font-family:inherit;font-size:var(--fs-b);font-weight:800;
    text-decoration:none;letter-spacing:-.03em;transition:opacity var(--t-press) var(--e-st)}
  .btn:active{opacity:.6}
  .btn.full{display:flex;width:100%}
  .btn.g{background:var(--stage);color:var(--t1)}
  .btn.o{background:transparent;color:var(--t1);border:1.5px solid var(--line2)}
  .fine{margin-top:var(--s3);font-size:var(--fs-m);font-weight:600;color:var(--t3);text-align:center}

  /* ── C3 PILL — 알약 + 검은 원형 화살표 ── */
  .lk{display:inline-flex;align-items:center;gap:var(--s3);min-height:48px;
    padding:var(--s2) var(--s2) var(--s2) 18px;border-radius:var(--r-pill);background:var(--stage);
    font-size:var(--fs-b);font-weight:700;color:var(--t1);text-decoration:none;
    transition:background var(--t-fast) var(--e-st)}
  .lk:active{background:#E6EAEE}
  .lk i{font-style:normal;width:34px;height:34px;border-radius:50%;flex:none;background:var(--t1);
    color:#fff;display:flex;align-items:center;justify-content:center}

  /* ── C5 BADGE ── */
  .bdg{display:inline-flex;align-items:center;gap:var(--s2);padding:7px 13px 7px 10px;
    border-radius:var(--r-pill);background:var(--stage);border:1px solid var(--line);
    font-size:var(--fs-m);font-weight:700;color:var(--t2)}
  .bdg i{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}

  /* ── C9 TAG ── */
  .tag{font-size:var(--fs-m);font-weight:700;border-radius:var(--r-sm);padding:5px 10px;
    border:1px solid currentColor;flex:none;white-space:nowrap}
  .tag.y{color:var(--ok);background:rgba(21,128,61,.07)}
  .tag.n{color:var(--warn);background:rgba(185,28,28,.06)}

  /* ══ 네비 ══ */
  .nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:background var(--t-slow) var(--e-st),backdrop-filter var(--t-slow) var(--e-st)}
  .nav .in{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad);
    display:flex;align-items:center;gap:var(--s4);min-height:56px}
  .brand{display:inline-flex;align-items:center;
    font-size:20px;font-weight:800;color:var(--t1);text-decoration:none;letter-spacing:-.03em}
  /* 로고 강조도 4.5:1 을 넘긴다 — 20px/800 이면 AA-대형은 통과하지만 예외를 남기지 않는다 */
  .brand i{font-style:normal;color:var(--brand-ink)}
  .nmenu{display:none;gap:var(--s5);margin-left:var(--s8)}
  .nmenu a{font-size:var(--fs-b);font-weight:600;color:var(--t2);text-decoration:none}
  .nmenu a.on{color:var(--t1);font-weight:700}
  .nav .sp{flex:1}
  .nav .ncta{font-size:14px;font-weight:700;color:var(--t1);text-decoration:none;
    border:1px solid var(--line2);border-radius:var(--r-pill);padding:9px 15px;min-height:40px;
    display:inline-flex;align-items:center}
  .burger{display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;min-width:44px;margin-right:-10px;border:0;background:none;color:var(--t1);cursor:pointer}
  @media (min-width:1025px){.nmenu{display:flex}.burger{display:none}}

  .drawer{position:fixed;inset:0;z-index:80;background:var(--bg);
    transform:translateX(100%);transition:transform var(--t-slow) var(--e-st);
    display:flex;flex-direction:column;padding:var(--s3) var(--pad) var(--s8)}
  .drawer.on{transform:none}
  .drawer .top{display:flex;justify-content:flex-end;min-height:48px;align-items:center}
  .drawer button{width:44px;height:44px;border:0;background:none;color:var(--t1);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .drawer nav{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s5)}
  .drawer nav a{padding:var(--s4) 0;font-size:20px;font-weight:700;color:var(--t1);text-decoration:none}

  /* ══ 하단 고정 실행바 — 본문 CTA 가 화면을 벗어난 뒤에만 올라온다 ══ */
  .fbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:var(--s3) var(--pad) 18px;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.94) 26%,var(--bg));
    transform:translateY(130%);transition:transform var(--t-slow) var(--e-st)}
  .fbar.show{transform:none}
  .fbar .in{max-width:var(--w-read);margin:0 auto;display:flex;gap:var(--s2)}

  /* ══ C1 STAGE + C2 SCREEN ══
     무대와 카드는 한 쌍이다. 무대만 유동으로 두면 카드가 구석에 남는다(390 85% → 1000 32%).
     무대에 상한을 걸고 배율을 밴드별로 올려 비율을 붙들어 둔다. */
  .stage{position:relative;border-radius:var(--r-xl);overflow:hidden;
    background:var(--stage);border:1px solid var(--line);aspect-ratio:1/1.06;
    max-width:420px;margin-left:auto;margin-right:auto}
  /* 지면은 같은 RGB 하나에서 알파만 떨어뜨린다. 2색 이상 램프는 AI 그라디언트 카드 문법이다 */
  .stage::before{content:'';position:absolute;inset:0;pointer-events:none}
  .stage.c1::before{background:linear-gradient(212deg,rgba(245,165,36,.30) 8%,rgba(245,165,36,0) 88%)}
  .stage.c2::before{background:linear-gradient(212deg,rgba(49,130,246,.26) 8%,rgba(49,130,246,0) 88%)}
  .stage.c3::before{background:linear-gradient(212deg,rgba(74,222,128,.30) 8%,rgba(74,222,128,0) 88%)}
  .stage.c4::before{background:linear-gradient(212deg,rgba(167,139,250,.30) 8%,rgba(167,139,250,0) 88%)}
  /* 제품 화면은 폰 실치수 400px 로 저작하고 통째로 축소한다.
     그래야 전역 타입 스케일에 12~15px 단이 생기지 않는다 */
  .ui{position:absolute;left:0;top:0;width:400px;transform-origin:0 0;
    transform:translate(34px,44px) scale(.72);
    background:var(--card);border:1px solid var(--line);border-radius:28px;
    box-shadow:var(--lift-lg);overflow:hidden}
  /* C4 ARROW */
  .arrow{position:absolute;z-index:3;right:9.1%;bottom:9.1%;width:48px;height:48px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.8);color:var(--t1);
    backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  @media (min-width:480px){
    .ui{transform:translate(40px,48px) scale(.82)}
  }
  @media (min-width:640px){
    .stage{max-width:520px}
    .ui{transform:translate(48px,56px) scale(.94)}
  }

  /* ══ 블록 — 페이지의 기본 단위 ══ */
  .blk{padding:0 var(--pad);margin-top:var(--gapblock);max-width:var(--w-page);
    margin-left:auto;margin-right:auto;width:100%}
  .blk h2{margin-top:var(--s6)}
  .blk .lk{margin-top:var(--s4)}
  @media (min-width:640px){.blk{max-width:var(--w-tab)}}
  @media (min-width:1025px){
    .blk{max-width:var(--w-page);display:grid;grid-template-columns:1.05fr 1fr;
      column-gap:64px;align-items:center}
    .blk .stage{grid-row:span 2;max-width:none;margin-left:0;margin-right:0;
      justify-self:stretch;aspect-ratio:1/.92}
    .blk:nth-of-type(even) .stage{order:2}
    .blk h2{margin-top:0;align-self:end}
    .blk .lk{align-self:start;margin-top:var(--s4)}
    .blk .ui{transform:translate(50px,58px) scale(1)}
  }

  /* ══ 히어로 ══ */
  .hero{padding:var(--s7) var(--pad) 0;max-width:var(--w-page);margin:0 auto;width:100%}
  .hero .sub{margin-top:var(--s3);font-size:var(--fs-b);font-weight:500;color:var(--t3);line-height:var(--lh5)}
  .hero .d1{margin-top:var(--s4)}
  .hero .win{margin-top:var(--s6)}
  .hero .hcta{margin-top:18px}
  @media (min-width:640px){
    .hero{max-width:var(--w-tab);padding-top:var(--s8)}
    .hero .sub{font-size:var(--fs-b)}
  }
  @media (min-width:1025px){
    .hero{max-width:var(--w-page);padding:var(--s11) var(--pad) 0;
      display:grid;grid-template-columns:minmax(0,1fr) minmax(470px,1.02fr);
      column-gap:64px;grid-template-rows:repeat(5,auto);align-content:center;min-height:600px}
    .hero .bdg{grid-column:1;grid-row:1;justify-self:start;align-self:start;font-size:14px}
    .hero .d1{grid-column:1;grid-row:2;margin-top:22px}
    .hero .sub{grid-column:1;grid-row:3;margin-top:18px;font-size:var(--fs-b);max-width:26em}
    .hero .hcta{grid-column:1;grid-row:4;margin:var(--s8) 0 0;max-width:320px}
    .hero .hfine{grid-column:1;grid-row:5;margin-top:var(--s3);text-align:left}
    .hero .win{grid-column:2;grid-row:1/span 5;align-self:center;margin-top:0;
      max-width:none;margin-left:0;margin-right:0;justify-self:stretch;
      aspect-ratio:auto;height:600px}
    .hero .win .ui{transform:translate(46px,52px) scale(1.04)}
  }

  /* ══ 문법 B — 퍼널 ══ */
  .qtop{position:sticky;top:0;z-index:40;background:var(--bg);padding:var(--s3) var(--pad) 0}
  .qtop .row{display:flex;align-items:center;gap:var(--s3);min-height:48px;
    max-width:var(--w-page);margin:0 auto}
  .qtop .bk{width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--t1);
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--s3)}
  .qtop .bk:active{background:var(--stage)}
  .qtop .n{font-size:var(--fs-b);font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
  .qtop .bar{height:4px;border-radius:var(--r-pill);background:var(--stage);overflow:hidden;
    margin:var(--s1) auto 0;max-width:var(--w-page)}
  .qtop .bar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill);
    transition:width var(--t-in) var(--e-in)}
  .qbody{flex:1;padding:var(--s7) var(--pad) var(--s8);display:flex;flex-direction:column;
    max-width:var(--w-page);margin:0 auto;width:100%}
  h1.q{font-size:30px;font-weight:800;color:var(--t1);line-height:1.32;letter-spacing:-.035em}
  .qfoot{margin-top:auto;padding-top:var(--s6);font-size:var(--fs-m);font-weight:500;color:var(--t3);line-height:var(--lh5)}
  .qhint{margin-top:var(--s3);font-size:var(--fs-m);font-weight:500;color:var(--t3);line-height:var(--lh5)}

  /* C6 OPTION */
  .opts{margin-top:var(--s6);display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:18px 20px;
    border-radius:var(--r);background:var(--stage);border:1.5px solid transparent;width:100%;
    font-family:inherit;font-size:var(--fs-b);font-weight:600;color:var(--t1);text-align:left;cursor:pointer;
    transition:border-color var(--t-press) var(--e-st),background var(--t-press) var(--e-st)}
  .opt .r{margin-left:auto;font-size:var(--fs-m);font-weight:500;color:var(--t3);flex:none}
  .opt .ck{margin-left:auto;color:var(--brand);opacity:0;transform:scale(.5);flex:none;
    transition:opacity var(--t-fast) linear,transform var(--t-slow) var(--spring)}
  .opt.on{border-color:var(--brand);background:rgba(49,130,246,.07)}
  .opt.on .ck{opacity:1;transform:scale(1)}
  .opt.on .r{display:none}
  .opt:active{background:#E9EDF1}

  /* 입력 */
  .fields{margin-top:var(--s5);display:flex;flex-direction:column;gap:10px}
  .fi input{width:100%;height:56px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--line2);
    background:var(--card);font-size:var(--fs-b);font-weight:600;color:var(--t1);font-family:inherit}
  .fi input::placeholder{color:var(--t4);font-weight:500}
  .fi input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
  .agree{margin-top:var(--s3);display:flex;gap:10px;align-items:flex-start;
    font-size:var(--fs-m);font-weight:500;color:var(--t3);line-height:var(--lh5)}
  .agree input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}

  /* 게이트 — 수치만 잠그고 판정은 공개한다 */
  .lockwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--stage);
    padding:var(--s6) var(--s5);margin-top:var(--s6)}
  .lockwrap::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(212deg,rgba(49,130,246,.22) 8%,rgba(49,130,246,0) 82%)}
  .lockwrap > *{position:relative}
  .lockamt{display:flex;align-items:baseline;gap:var(--s2);margin-top:6px}

   SELECT 는 막아뒀다 — 키가 새어도 남의 리드를 읽을 수 없다.
   ══════════════════════════════════════ */
/* 빚탈길 전용 프로젝트(2026-08-26 신설, 서울 리전).
   전에는 신용톡톡 프로젝트에 얹혀 있었다 — 운영 주체가 다른 서비스의
   개인정보를 한 DB 에 두면 제3자 제공 문제가 되므로 분리했다. */
const SB_URL='https://eapompomalqhlkzbkdvc.supabase.co';
const SB_KEY='sb_publishable_aazxQRK3-gSIRGJ6zHND9w_lE-9Ly9t';

/* 유입 경로 — 첫 방문 시점의 것을 잡아둔다.
   해시 라우팅이라 나중에 읽으면 utm 이 이미 사라져 있다. */
const TRACK=(()=>{
  const KEY='btg_track';
  try{
    const saved=sessionStorage.getItem(KEY);
    if(saved) return JSON.parse(saved);
    const q=new URLSearchParams(location.search);
    const t={
      session_id: (crypto.randomUUID? crypto.randomUUID() : String(Date.now())+Math.random()),
      landing_path: location.pathname+location.search+location.hash,
      first_referrer: document.referrer||null,
      utm_source:q.get('utm_source'), utm_medium:q.get('utm_medium'),
      utm_campaign:q.get('utm_campaign'), utm_content:q.get('utm_content'),
      utm_term:q.get('utm_term'),
      user_agent: navigator.userAgent,
      device: matchMedia('(max-width:759px)').matches? 'mobile':'desktop'
    };
    sessionStorage.setItem(KEY, JSON.stringify(t));
    return t;
  }catch(e){ return {}; }
})();

const digits=s=>String(s||'').replace(/[^0-9]/g,'');

/* 같은 번호로 연달아 보내는 것만 막는다(오클릭·재제출).
   진짜 스팸 차단은 서버가 할 일이지 브라우저가 할 일이 아니다. */
function recentlySent(phone){
  try{
    const k='btg_sent_'+phone, last=+(localStorage.getItem(k)||0);
    if(Date.now()-last < 60*1000) return true;
    localStorage.setItem(k, String(Date.now()));
    return false;
  }catch(e){ return false; }
}

  const r=await fetch(SB_URL+'/rest/v1/bittalgil_leads',{
    method:'POST',
    headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY,
             'Content-Type':'application/json', Prefer:'return=minimal'},
    body:JSON.stringify({...TRACK, ...payload})
  });
  if(!r.ok){

}

/* ══════════════ 변제금 계산 엔진 ══════════════
   sinyong-toktok-lead 의 best-case-calculator.ts / eligibility-engine.ts 를
   그대로 옮긴 것. 상수와 산식을 바꾸지 말 것 — 바꾸려면 원본과 함께 고쳐야 한다.

     변제금 = max(가용소득 × 36개월, 청산가치)
     가용소득 = 월소득 − (가구원수별 생계비 × 1.10)
     가용소득 ≤ 0 이면 가구원 수를 1씩 줄여가며 양수 지점을 찾는다
     변제율 5% 미만이면 강제 상향 (법원 실무상 인가 어려움)
   ══════════════════════════════════════════ */

/* 보건복지부 고시 제2025-135호 (2026년 적용) */
const MEDIAN_INCOME={1:2564238,2:4199292,3:5359036,4:6494738,5:7556719,6:8555952,7:9515150};
const EXTRA_PER_PERSON=580000;      // 8인 이상: 7인 + 인당 58만
const LIVING_COST_RATIO=0.6;        // 생계비 = 중위소득 60%
const LIVING_COST_BUFFER=1.10;      // 의료비·임대료 등 추가 공제 버퍼 → 보수적으로 잡는다
const REPAYMENT_MONTHS=36;
const MIN_REPAYMENT_RATE=0.05;
const DEBT_MIN=10000000, DEBT_MAX_UNSECURED=1000000000, DEBT_MAX_SECURED=1500000000;

const medianIncome=n=>{const s=Math.max(1,n);
  return s<=7? MEDIAN_INCOME[s] : MEDIAN_INCOME[7]+(s-7)*EXTRA_PER_PERSON;};
const livingCostOf=n=>Math.round(medianIncome(n)*LIVING_COST_RATIO);
const MIN_INCOME_FOR_ELIGIBILITY=Math.round(MEDIAN_INCOME[1]*LIVING_COST_RATIO); // 1,538,543원

const roundClean=a=>a>=10000000?Math.round(a/1000000)*1000000
                  :a>=1000000 ?Math.round(a/100000)*100000
                              :Math.round(a/10000)*10000;
const roundMonthly=a=>Math.floor(a/1000)*1000;

function calcBestCase(inp){
  const {monthlyIncome,householdSize,totalDebt,assetValue,hasSecuredDebt}=inp;
  const debtLimit=hasSecuredDebt?DEBT_MAX_SECURED:DEBT_MAX_UNSECURED;
  const liquidationValue=Math.max(0,assetValue);

  const inelig=reason=>({originalDebt:totalDebt,estimatedRepayment:0,reductionAmount:0,
    reductionPercent:0,monthlyPayment:0,repaymentMonths:0,isEligible:false,
    ineligibilityReason:reason,livingCost:Math.round(livingCostOf(householdSize)*LIVING_COST_BUFFER),
    monthlyDisposable:0,disposableTotal:0,liquidationValue,determinedBy:'income',
    effectiveHouseholdSize:householdSize,isHouseholdAdjusted:false,isMinRepaymentApplied:false});

  if(totalDebt<DEBT_MIN) return inelig('TOO_LOW');
  if(totalDebt>debtLimit) return inelig('TOO_HIGH');

  /* 부양가족 자동 조절 — 가용소득이 양수가 되는 최대 가구원 수를 찾는다 */
  let size=householdSize;
  let livingCost=Math.round(livingCostOf(size)*LIVING_COST_BUFFER);
  let monthlyDisposable=monthlyIncome-livingCost;
  while(monthlyDisposable<=0 && size>1){
    size-=1;
    livingCost=Math.round(livingCostOf(size)*LIVING_COST_BUFFER);
    monthlyDisposable=monthlyIncome-livingCost;
  }
  if(monthlyDisposable<0) monthlyDisposable=0;   // 1인까지 줄여도 음수면 청산가치로만

  const disposableTotal=monthlyDisposable*REPAYMENT_MONTHS;
  let totalRepayment=Math.max(disposableTotal,liquidationValue);
  let determinedBy=disposableTotal>=liquidationValue?'income':'asset';

  /* 변제금이 채무 이상이면 회생 실익이 없다 */
  if(totalRepayment>=totalDebt) return {originalDebt:totalDebt,estimatedRepayment:totalDebt,
    reductionAmount:0,reductionPercent:0,monthlyPayment:roundMonthly(totalDebt/REPAYMENT_MONTHS),
    repaymentMonths:REPAYMENT_MONTHS,isEligible:false,ineligibilityReason:'NO_REDUCTION',
    livingCost,monthlyDisposable,disposableTotal,liquidationValue,determinedBy,
    effectiveHouseholdSize:size,isHouseholdAdjusted:size<householdSize,isMinRepaymentApplied:false};

  const minRepayment=Math.round(totalDebt*MIN_REPAYMENT_RATE);
  let isMinRepaymentApplied=false;
  if(totalRepayment<minRepayment){totalRepayment=minRepayment;determinedBy='min_rate';isMinRepaymentApplied=true;}

  const estimatedRepayment=Math.min(roundClean(totalRepayment),totalDebt);
  const reductionAmount=Math.max(0,totalDebt-estimatedRepayment);
  return {originalDebt:totalDebt,estimatedRepayment,reductionAmount,
    reductionPercent:totalDebt>0?Math.round(reductionAmount/totalDebt*100):0,
    monthlyPayment:roundMonthly(totalRepayment/REPAYMENT_MONTHS),
    repaymentMonths:REPAYMENT_MONTHS,isEligible:true,
    livingCost,monthlyDisposable,disposableTotal,liquidationValue,determinedBy,
    effectiveHouseholdSize:size,isHouseholdAdjusted:size<householdSize,isMinRepaymentApplied};
}

const wonStr=n=>n.toLocaleString('ko-KR')+'원';

function checkEligibility(inp){
  const calc=calcBestCase(inp);
  const hasJobIncome=inp.jobId!=='none';
  const incomeOk=hasJobIncome && inp.monthlyIncome>=MIN_INCOME_FOR_ELIGIBILITY;
  const debtLimit=inp.hasSecuredDebt?DEBT_MAX_SECURED:DEBT_MAX_UNSECURED;
  const debtOk=inp.totalDebt>=DEBT_MIN && inp.totalDebt<=debtLimit;
  const insolvencyOk=calc.liquidationValue<inp.totalDebt;

  const conditions=[
    {n:'소득 요건',s:'1인 최저생계비 이상',p:incomeOk?1:0,
     v:hasJobIncome?('월 '+wonStr(inp.monthlyIncome)):'정기 소득 없음'},
    {n:'채무 요건',s:'1천만 ~ 15억 원',p:debtOk?1:0,
     v:'총 '+wonStr(inp.totalDebt)},
    {n:'재산 대비 채무',s:'청산가치 판정',p:insolvencyOk?1:0,
     v:insolvencyOk?('재산 '+wonStr(calc.liquidationValue)):'재산이 채무보다 큼'},
    {n:'감액 가능성',s:'회생 실익 판정',p:calc.isEligible?1:0,
     v:calc.isEligible?('감액 '+wonStr(calc.reductionAmount)+' ('+calc.reductionPercent+'%)')
                      :'자력 변제 가능 — 회생 실익 작음'}
  ];
  return {isEligible:conditions.every(c=>c.p)&&calc.isEligible, conditions, calc};
}

/* ── 9문항 답(구간) → 엔진 입력(금액) 매핑 ──
   문항이 구간만 받으므로 구간의 대표값을 쓴다. 각 구간의 중앙값이며
   열린 구간(1억 이상 등)은 경계에서 한 단계 올린 값이다.
   실제 금액은 상담에서 확정된다 — 화면에도 그렇게 밝힌다. */
const MAP={
  debt:    [8000000, 20000000, 65000000, 150000000],        // Q0
  job:     ['employee','freelance','daily','none'],          // Q3
  income:  [1300000, 2000000, 3250000, 4800000],             // Q4
  house:   [1,2,3,4],                                        // Q5 부양가족 → 가구원 수
  asset:   [0, 30000000, 20000000, 80000000],                // Q6
  /* Q6 주의: '전·월세 보증금'이 '1천만~3천만'보다 클 수 있어 순서가 단조롭지 않다.
     소액임차보증금 일부는 면제재산이라 청산가치에서 빠지는데 문항으로는 구분이 안 된다.
     → 문항 자체를 금액 입력으로 바꾸는 게 맞다. 지금은 대표값으로 둔다. */
};

function buildInput(ans){
  const g=(i,arr,dflt)=>arr[ans[i]] !== undefined ? arr[ans[i]] : dflt;
  const jobId=g(3,MAP.job,'employee');
  return {
    jobId,
    monthlyIncome: jobId==='none' ? 0 : g(4,MAP.income,2000000),
    householdSize: g(5,MAP.house,1),
    totalDebt:     g(0,MAP.debt,20000000),
    assetValue:    g(6,MAP.asset,0),
    hasSecuredDebt: ans[6]===3,        // 자가·차량 → 담보 채무 가능성
  };
}

      <p class="rnote">가용소득 = 월 소득 − 가구원 수별 생계비. 법원이 실제로 쓰는 산식으로 계산했습니다.
        구간으로 답한 값이라 추정치이며, 실제 인가액은 사건에 따라 달라집니다.</p>

function go(h){if(location.hash===h)render();else location.hash=h;}
function render(){
  const raw=(location.hash||'#/').replace('#','');
  const seg=raw.split('/').filter(Boolean);
  const m=document.getElementById('main');
  let key,html;
  if(seg[0]==='solutions'&&seg[1]){html=R.solutionDetail(seg[1]);key='/solutions';}
  else if(seg[0]==='columns'&&seg[1]){html=R.columnDetail(seg[1]);key='/columns';}
  else{key='/'+(seg[0]||'');const fn=ROUTES[key];
    html=fn?(fn==='legal'?R.legal(seg[0]):R[fn]()):R.home();}
  m.innerHTML=html;
  const flow=key==='/q'||key==='/result'||key==='/done';
  document.getElementById('nav').style.display=flow?'none':'';
  const fb=document.getElementById('fbar');
  fb.style.display=(flow||key==='/diagnosis')?'none':'';fb.classList.remove('show');
  document.querySelectorAll('#nmenu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+key));
  window.scrollTo(0,0);bind(key);
}

  const STEPS=[{i:0,n:'1 / 9',p:11,pick:2},{i:4,n:'5 / 9',p:56,pick:2}];
  const setQ=k=>{const st=STEPS[k],q=QS[st.i];
    $('dStep').textContent=st.n; $('dPg').style.width=st.p+'%'; $('dQz').innerHTML=q.q;
    opts.forEach((o,n)=>{const t=q.o[n];
      o.style.display=t?'':'none';
      if(t)$('dO'+n).textContent=t[0];
      o.classList.remove('on');});};
  const show=(a,b)=>{a.className='scn out';b.className='scn in';};
  const done=()=>{$('dHd').textContent='진단 리포트';$('dStep').textContent='예시';
    show($('dQ'),$('dR'));$('dAmt').textContent='478,000';
    $('dBar').style.transition='none';$('dBar').style.width='74%';$('dVerd').style.opacity='1';};
  if(RM){done();return;}

  let T=[];const at=(ms,fn)=>T.push(setTimeout(fn,ms));
  const count=(el,to,ms)=>{const t0=performance.now();
    (function tick(now){const p=Math.min((now-t0)/ms,1);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('ko-KR');
      if(p<1)requestAnimationFrame(tick);})(t0);};
  function run(){
    T.forEach(clearTimeout);T=[];
    $('dHd').textContent='변제금 진단';show($('dR'),$('dQ'));
    $('dBar').style.transition='none';$('dBar').style.width='0';
    $('dVerd').style.opacity='0';$('dAmt').textContent='0';setQ(0);
    at(1100,()=>opts[STEPS[0].pick].classList.add('on'));
    at(2200,()=>setQ(1));
    at(3400,()=>opts[STEPS[1].pick].classList.add('on'));
    at(4400,()=>{$('dHd').textContent='진단 리포트';$('dStep').textContent='예시';show($('dQ'),$('dR'));});
    at(4800,()=>{count($('dAmt'),478000,900);
      $('dBar').style.transition='width var(--t-draw) cubic-bezier(.25,.46,.45,.94)';$('dBar').style.width='74%';});
    at(6100,()=>$('dVerd').style.opacity='1');
    at(9400,run);
  }
  /* 화면 밖에서는 돌리지 않는다 */
  new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting)run(); else {T.forEach(clearTimeout);T=[];}
  }),{threshold:.25}).observe(box.closest('.win')||box);
}

/* ══ 진단 퍼널 ══ */
let qi=0; const ans=[];
let RESULT=null;

/* 문항별 도움말 — 구간 선택에서 멈추는 지점을 메운다 */
const QHINT={0:'카드론·현금서비스·연체이자까지 합친 금액입니다',
  1:'하루라도 밀렸으면 연체입니다',
  3:'4대보험 없이 일해도 소득이 있으면 회생이 됩니다',
  4:'세금 떼기 전 총액 기준입니다',
  5:'함께 사는 배우자·자녀·부모를 셉니다. 생계비가 달라집니다',
  6:'전·월세 보증금도 재산에 들어갑니다'};

function renderQ(){
  const stage=document.getElementById('qStage'); if(!stage)return;
  document.getElementById('qN').textContent=(qi+1)+' / 9';
  document.getElementById('qBar').style.width=((qi+1)/9*100).toFixed(1)+'%';
  const s=QS[qi];
  stage.innerHTML=`<div class="qbody">
    <h1 class="q">${s.q}</h1>
    <div class="opts">${s.o.map((o,i)=>`<button class="opt${ans[qi]===i?' on':''}" data-i="${i}" data-h="light" type="button">
      <span>${o[0]}</span>${o[1]?`<span class="r">${o[1]}</span>`:''}<span class="ck">${IC.check(22)}</span></button>`).join('')}</div>
    ${QHINT[qi]?`<p class="qhint">${QHINT[qi]}</p>`:''}
    <p class="qfoot">고르면 바로 다음 문항으로 넘어갑니다. 이름·연락처는 마지막에 결과를 열 때 한 번만 받습니다.</p>
  </div>`;
  stage.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    o.classList.add('on'); ans[qi]=+o.dataset.i;
    setTimeout(()=>{ if(qi<8){qi++;renderQ();} else renderGate(); },240);});
}

/* 9지점 게이트 — 수치만 잠그고 판정 4가지는 미리 준다.
   아무것도 안 주고 연락처만 요구하면 이탈한다. */
function renderGate(){
  RESULT=checkEligibility(buildInput(ans)); window.RESULT=RESULT;
  const stage=document.getElementById('qStage');
  document.getElementById('qN').textContent='완료';   /* 문항 9 도 9/9 라 그대로 두면 같은 라벨이 두 번 나온다 */
  document.getElementById('qBar').style.width='100%';
  stage.innerHTML=`<div class="qbody">
    <h1 class="q">계산이<br>끝났습니다</h1>
    <div class="lockwrap">
      <p class="rk">예상 월 변제금</p>
      <div class="lockamt"><b class="num" aria-hidden="true">000,000</b><span>원</span></div>
      <div class="lockbar"><i></i></div>
      <p class="lockmsg">${IC.lock}이름과 연락처를 남기면 바로 열립니다. 상담 신청은 그다음에 따로 고르실 수 있습니다.</p>
    </div>
    <div class="conds" style="margin-top:var(--s4)">${conds(RESULT.conditions)}</div>
    <form id="gForm" novalidate>
      <div class="fields">
        <div class="fi"><input type="text" name="name" placeholder="이름" autocomplete="name"></div>
        <div class="fi"><input type="tel" name="phone" placeholder="연락처" inputmode="numeric" autocomplete="tel"></div>
      </div>
      <label class="agree"><input type="checkbox" name="agree">
        <span><a href="#/privacy">개인정보 수집·이용</a>에 동의합니다. 수집 항목은 이름·연락처이며 상담 연결 목적에만 씁니다.</span></label>
      <button class="btn full" type="submit" style="margin-top:var(--s5)" data-h="medium">결과 확인하기</button>
      <p class="legal">${OP.name}가 운영하며 법률사무는 ${BIZ.firm}이 수행합니다. 광고책임변호사 ${BIZ.lawyer}.</p>
    </form>
  </div>`;
  const f=document.getElementById('gForm');
  f.onsubmit=e=>{e.preventDefault();
    const n=f.name_?null:f.querySelector('[name=name]'), t=f.querySelector('[name=phone]'), a=f.querySelector('[name=agree]');
    let ok=true;
    if(!n.value.trim()){n.focus();ok=false;}
    else if(!/^01[016789][-\s]?\d{3,4}[-\s]?\d{4}$/.test(t.value.trim())){t.focus();ok=false;}
    else if(!a.checked){a.focus();ok=false;}
    if(!ok)return;
    try{sessionStorage.setItem('btg_ans',JSON.stringify(ans));}catch(_){}
    submitLead(f,{name:n.value.trim(), phone:digits(t.value), form:'gate',
      answers:ans.slice(), calc:RESULT?RESULT.calc:null, eligible:RESULT?RESULT.isEligible:null}, '#/result');
  };
}

/* 폼 제출 — 저장에 성공했을 때만 다음 화면으로 보낸다.
   실패했는데 접수됐다고 말하면 오지 않을 전화를 기다리게 된다. */
async function submitLead(form, payload, next){
  const btn=form.querySelector('button[type=submit]');
  const label=btn.textContent;
  let err=form.querySelector('.formerr');
  if(!err){ err=el('<p class="formerr fine" role="alert" style="text-align:left"></p>'); form.appendChild(err); }
  err.textContent='';
  const dest=next||'#/done';
  if(recentlySent(payload.phone)){ sessionStorage.setItem('kn',payload.name); go(dest); return; }
  btn.disabled=true; btn.textContent='보내는 중…';
  try{
    await sendLead({...payload, consent:true, consent_at:new Date().toISOString()});
    sessionStorage.setItem('kn',payload.name);
    HAP.success(); go(dest);
  }catch(e){
    btn.disabled=false; btn.textContent=label;
    err.textContent='전송에 실패했습니다. 잠시 후 다시 시도하시거나 '+BIZ.tel+' 로 전화 주세요.';
    err.style.color='var(--warn)';
    console.error('lead submit failed:', e.message);
  }
}

/* ══ 화면 배선 ══ */
function bind(key){
  /* 리빌 — 발동선은 뷰포트 고정(threshold 는 요소 높이에 비례해 흔들린다).
     이동거리는 교차 직전에 실제 높이로 분류한다(bind 시점은 폰트 착지 전이라 오분류된다) */
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;
    const h=e.boundingClientRect.height;
    e.target.classList.add(h<80?'d1t':h<200?'d2t':h<420?'d3t':'d4t','shown');
    io.unobserve(e.target);
  }),{threshold:0,rootMargin:'0px 0px -25% 0px'});
  document.querySelectorAll('.rv').forEach(e=>io.observe(e));

  if(RM){document.querySelectorAll('[data-seq]').forEach(e=>e.classList.add('go','nomo'));}
  else{const so=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('go');so.unobserve(e.target);}
    }),{threshold:0,rootMargin:'0px 0px -25% 0px'});
    document.querySelectorAll('[data-seq]').forEach(e=>so.observe(e));}

  initHeroDemo(); initFaq();

  if(key==='/q'){
    /* 다시 시작하면 1번부터. 리셋이 없으면 9/9 에 멈춰 두 번째 진단이 불가능하다 */
    qi=0; ans.length=0; RESULT=null; window.RESULT=null;
    renderQ();
    document.getElementById('qBack').onclick=()=>{
      if(qi===0)go('#/diagnosis'); else {qi--;renderQ();}};
  }
  if(key==='/result'){
    const bar=document.getElementById('rBar');
    if(bar) requestAnimationFrame(()=>{bar.style.width=(bar.dataset.w||0)+'%';});
  }
  if(key==='/done')HAP.success();
  if(key==='/consult'){
    const cf=document.getElementById('cForm');
    if(cf) cf.onsubmit=e=>{e.preventDefault();
      const n=cf.querySelector('[name=name]'),t=cf.querySelector('[name=phone]'),a=cf.querySelector('[name=agree]');
      let ok=true;
      if(!n.value.trim()){n.focus();ok=false;}
      else if(!/^01[016789][-\s]?\d{3,4}[-\s]?\d{4}$/.test(t.value.trim())){t.focus();ok=false;}
      else if(!a.checked){a.focus();ok=false;}
      if(!ok)return;
      submitLead(cf,{name:n.value.trim(), phone:digits(t.value), form:'consult'});
    };
  }
}
