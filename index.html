
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="개인회생 변제금을 1분 만에 진단합니다. 법무법인 현암이 직접 검토합니다.">
<meta name="theme-color" content="#0B0D10">
<link rel="canonical" href="https://bittalgil.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="빚탈길">
<meta property="og:title" content="빚탈길 — 내 빚, 얼마나 줄어들까">
<meta property="og:description" content="개인회생 변제금을 1분 만에 진단합니다. 법무법인 현암이 직접 검토합니다.">
<meta property="og:url" content="https://bittalgil.com/">
<meta property="og:image" content="https://bittalgil.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>빚탈길 — 개인회생 변제금 진단</title>
<style>
  
  :root{
    --bg:#0B0D10; --surf:#1C1F25; --surf2:#22262E;
    --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.14);
    --glow:inset 0 0 40px rgba(255,255,255,.03);
    --shadow:0 8px 32px rgba(0,0,0,.4);
    --t1:#FFFFFF; --t2:rgba(255,255,255,.86); --t3:#94A3B8; --t4:#858E9D /* 4.59 on surf2 — 7A8290 은 3.92 로 AA 미달이었다 */;
    --key:#F5A524; --ok:#4ADE80; --warn:#F87171;
    --fs-d1:40px; --fs-d2:36px; --fs-d3:28px; --fs-t:18px; --fs-b:16px; --fs-m:14px; --fs-mock:12px;
    --ls:-.02em; --lh1:1.2; --lh2:1.28; --lh3:1.4; --lh4:1.48; --lh5:1.6;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:28px;--s8:32px;--s9:44px;--s10:56px;--s11:64px;--s12:80px;
    --pad:20px; --sec:56px; --panel-pad:24px; --hero-pad:40px;
    --ph:url("img/ph-hands.webp");
    --r-sm:6px; --r:16px; --r-lg:24px; --r-pill:999px;
    --t-fast:.15s; --t-draw:1.1s; --t-slow:.3s;
    --e-in:cubic-bezier(.25,.46,.45,.94); --e-st:cubic-bezier(.4,0,.2,1);
    --spring:cubic-bezier(.34,1.56,.64,1);   /* toss 프레스 실측 — 1.56 오버슈트 */
    --w-page:1280px; --w-read:560px; --w-art:720px;
    /* 층2 — 고도 2단 + 상단 하이라이트 */
    --lift:0 8px 24px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.6);
    --lift-sm:0 4px 14px rgba(0,0,0,.28);
    --hl:inset 0 1px 0 rgba(255,255,255,.07);
  }
  @media (min-width:640px){:root{--fs-d1:56px;--fs-d2:40px;--fs-d3:32px;--fs-t:20px;--panel-pad:32px;--hero-pad:56px}}
  @media (min-width:1024px){:root{--fs-d1:80px;--fs-d2:48px;--pad:56px;--sec:80px;--panel-pad:56px;--hero-pad:64px}}

  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;letter-spacing:-.02em}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  /* ══ 층1 지면 — 평면 금지, 은은한 글로우 필드 ══ */
  body{background:var(--bg);color:var(--t2);font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;
       font-size:var(--fs-b);line-height:var(--lh5);word-break:keep-all;overflow-x:hidden;position:relative;
       /* 어두운 바탕 위 흰 글자는 서브픽셀 AA에서 색 테두리(청록 얼룩)가 생긴다.
          그레이스케일 AA로 바꾸면 사라지고 획도 얇아져 다크에서 더 정확해진다 */
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
       text-rendering:optimizeLegibility}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(58% 42% at 12% 4%,rgba(245,165,36,.10),transparent 62%),
               radial-gradient(52% 40% at 92% 26%,rgba(96,165,250,.09),transparent 64%),
               radial-gradient(64% 44% at 46% 98%,rgba(74,222,128,.06),transparent 62%)}
  /* 섹션 스테이지 — 콘텐츠가 올라앉는 면 */
  .field{position:relative;border-radius:var(--r-xl);overflow:hidden;padding:var(--s9) var(--panel-pad);
    background:radial-gradient(70% 55% at 18% 10%,rgba(245,165,36,.13),transparent 60%),
               radial-gradient(60% 50% at 88% 24%,rgba(96,165,250,.11),transparent 62%),#111418;
    box-shadow:var(--hl)}
  img{max-width:100%;display:block}
  button,input,select,textarea{font-family:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{text-decoration:none;color:inherit}
  a.inline{display:inline-flex;align-items:center;min-height:48px;font-size:var(--fs-b)}
  .wrap{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad)}
  .read{max-width:var(--w-art);margin:0 auto;padding:0 var(--pad)}

  .d1{font-size:var(--fs-d1);font-weight:700;line-height:var(--lh1);letter-spacing:normal;color:var(--t1);text-wrap:balance}
  .d2{font-size:var(--fs-d2);font-weight:700;line-height:var(--lh2);color:var(--t1);text-wrap:balance}
  .d3{font-size:var(--fs-d3);font-weight:700;line-height:var(--lh3);color:var(--t1)}
  .tt{font-size:var(--fs-t);font-weight:700;line-height:var(--lh4);color:var(--t1)}
  .bd{font-size:var(--fs-b);font-weight:500;line-height:var(--lh5);color:var(--t2)}
  .cap{font-size:var(--fs-m);font-weight:500;line-height:var(--lh5);color:var(--t3)}
  .fine{font-size:var(--fs-m);font-weight:500;line-height:var(--lh5);color:var(--t4)}
  /* 전송 실패 안내 — 실패를 조용히 넘기지 않는다 */
  .formerr.bad{color:var(--warn);padding:var(--s3) var(--s4);border-radius:var(--r-sm);
    background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.28)}
  .kick{font-size:var(--fs-m);font-weight:700;color:var(--key)}

  /* ══ 인터랙션② 프레스 스프링 (toss 실측 오버슈트) ══ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);background:#fff;color:#0B0D10;
       font-size:var(--fs-b);font-weight:700;padding:var(--s4) var(--s7);border-radius:var(--r-pill);min-height:48px;
       transition:transform .2s var(--spring),background var(--t-slow) ease,box-shadow var(--t-slow) ease;
       box-shadow:var(--lift-sm)}
  .btn:hover{background:#f2f3f4;box-shadow:var(--lift)}
  .btn:active{transform:scale(.94)}
  .btn.g{background:rgba(255,255,255,.09);color:var(--t1)}
  .btn.o{background:transparent;border:1px solid var(--hair2);color:var(--t1)}
  .btn.blk{width:100%;padding:var(--s4)}
  .rv{opacity:0;transform:translateY(var(--s3));transition:opacity .5s var(--e-in),transform .5s var(--e-in)}
  .rv.shown{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important}}

  /* 헤더 */
  .nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:background var(--t-slow) var(--e-st)}
  .nav.s{background:rgba(11,13,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
  .nav > .in{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad);height:64px;display:flex;align-items:center;gap:var(--s6)}
  .brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:var(--fs-t);color:var(--t1);line-height:var(--lh4);min-height:48px}
  /* 마크 = 길. 아래에서 위로 좁아지는 두 선이 소실점에서 만나고, 그 끝에 빛이 있다 */
  .brand .m{width:18px;height:18px;flex:none;display:block}
  .nmenu{display:none;gap:var(--s6);font-size:var(--fs-b);font-weight:600;color:var(--t3)}
  .nmenu a{min-height:48px;display:inline-flex;align-items:center}
  .nmenu a:hover,.nmenu a.on{color:var(--t1)}
  .nav .sp{flex:1}
  .nav .cta{display:inline-flex;align-items:center;background:#fff;color:#0B0D10;font-size:var(--fs-b);font-weight:700;padding:0 var(--s4);min-height:48px;border-radius:var(--r-pill);line-height:var(--lh4)}
  .burger{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;font-size:20px;color:var(--t1)}
  @media (min-width:1024px){.nmenu{display:flex}.burger{display:none}}
  .drawer{position:fixed;inset:0;z-index:70;background:rgba(11,13,16,.97);display:none;flex-direction:column;padding:var(--s4) var(--pad)}
  .drawer.on{display:flex}
  .drawer .top{display:flex;justify-content:flex-end}
  .drawer .top button{min-height:48px;min-width:48px;font-size:24px;color:var(--t1)}
  .drawer nav{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s6)}
  .drawer nav a{font-size:var(--fs-d3);font-weight:700;color:var(--t1);padding:var(--s3) 0}

  /* 히어로 */
  /* ══ 히어로 — 영상 슬롯 + Ken Burns 폴백 ══ */
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden}
  .hero .media{position:absolute;inset:0;overflow:hidden}
  /* grayscale 은 흑백 인물컷 전제의 규칙이었다.
     지금 히어로는 문틈에서 새는 따뜻한 빛이 핵심이라 채도를 죽이면 안 된다 */
  .hero img,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 46%;
    filter:contrast(1.04) brightness(.78) saturate(.92)}
  .hero video{opacity:0;transition:opacity .6s var(--e-in)}
  .hero video.ready{opacity:1}
  /* Ken Burns — 실촬 확보 전 0KB 대체 */
  .hero img.kb{animation:kenburns 26s ease-in-out infinite alternate;transform-origin:64% 38%}
  @keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
  .hero .grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
  .hero .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.62),rgba(11,13,16,.15) 32%,rgba(11,13,16,.88) 84%,var(--bg))}
  .hero .in{position:absolute;left:0;right:0;bottom:0;padding:0 var(--pad) var(--hero-pad);max-width:var(--w-page);margin:0 auto;display:flex;flex-direction:column;gap:var(--s8)}
  .hero .acts{display:flex;gap:var(--s2);flex-wrap:wrap}

  /* 페이지 헤더 */
  .phead{padding:calc(64px + var(--s12)) 0 0}
  .phead > .in{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad);display:flex;flex-direction:column;
             gap:var(--s4);align-items:flex-start;text-align:left}
  .phead .bd{max-width:52ch}

  .sec{padding:var(--sec) 0 0}
  .stack{display:flex;flex-direction:column;gap:var(--s8)}
  .stack.sm{gap:var(--s6)}
  .panel{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surf);min-height:420px;display:flex;align-items:center}
  .panel .body{position:relative;z-index:2;padding:var(--panel-pad);width:100%;max-width:var(--w-read);display:flex;flex-direction:column;gap:var(--s4)}
  .panel .visual{position:absolute;right:0;top:0;bottom:0;width:52%;display:flex;align-items:center;justify-content:center;z-index:1;overflow:hidden;padding:var(--s6)}
  @media (min-width:1024px){.panel{min-height:560px}.panel .visual{padding:var(--s9)}}
  @media (max-width:860px){.panel{flex-direction:column;align-items:stretch;min-height:0}.panel .visual{position:relative;width:100%;order:2;height:320px}.panel .body{order:1;max-width:none}}

  /* 카드 그리드 */
  .grid{display:grid;grid-template-columns:1fr;gap:var(--s3)}
  @media (min-width:640px){.grid.c2{grid-template-columns:1fr 1fr}}
  @media (min-width:1024px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
  /* ══ 층2 고도 — 카드는 부양한다 ══ */
  .card{background:var(--surf);border:1px solid var(--hair);border-radius:var(--r-lg);padding:var(--s6);
        display:flex;flex-direction:column;gap:var(--s3);box-shadow:var(--lift-sm),var(--hl);
        transition:transform var(--t-slow) var(--e-st),box-shadow var(--t-slow) var(--e-st),background var(--t-slow) ease}
  .card .n{font-size:var(--fs-m);font-weight:700;color:var(--key);font-variant-numeric:tabular-nums}
  .card.link{cursor:pointer}
  .card.link:hover{background:var(--surf2);box-shadow:var(--lift),var(--hl);transform:translateY(-2px)}
  .card.link:active{transform:scale(.985);transition:transform .2s var(--spring)}
  /* 아이콘 슬롯 */
  .ics{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
  /* 상태 칩 */
  .chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:5px 11px;border-radius:var(--r-pill);
        background:rgba(255,255,255,.07);color:var(--t3);white-space:nowrap;letter-spacing:var(--ls)}
  .chip.ok{background:rgba(74,222,128,.14);color:var(--ok)}
  .chip.warn{background:rgba(248,113,113,.16);color:var(--warn)}
  .chip.key{background:rgba(245,165,36,.14);color:var(--key)}
  /* 층3 — 행이 자기 면을 가진다 */
  .lrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-radius:var(--r);background:var(--surf2);
        border:1px solid transparent;transition:background var(--t-slow) ease,border-color var(--t-slow) ease,transform var(--t-fast) var(--spring)}
  .lrow:active{transform:scale(.99)}
  .lrow .nm{font-size:var(--fs-b);font-weight:600;color:var(--t1)}
  /* 판정 근거값 — 항목명 아래 작게. 근거 없이 결론만 보여주면 못 믿는다 */
  .lrow .nm .sub{display:block;margin-top:2px;font-size:var(--fs-m);font-weight:500;
    color:var(--t4);font-variant-numeric:tabular-nums}
  .lrow .chip{margin-left:auto}
  .lrow.alert{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.4)}
  .lrow.lock .nm{color:rgba(255,255,255,.34)}
  .lrow.lock .ics{opacity:.4}
  .lstack{display:flex;flex-direction:column;gap:var(--s2)}
  /* 층4 — 순차 등장 90ms */
  .seq > *{opacity:0;transform:translateY(10px)}
  .seq.nomo > *{opacity:1;transform:none;animation:none}
  .seq.go > *{animation:pop .46s var(--e-in) forwards}
  .seq.go > *:nth-child(1){animation-delay:.05s}.seq.go > *:nth-child(2){animation-delay:.14s}
  .seq.go > *:nth-child(3){animation-delay:.23s}.seq.go > *:nth-child(4){animation-delay:.32s}
  .seq.go > *:nth-child(5){animation-delay:.41s}.seq.go > *:nth-child(6){animation-delay:.50s}
  @keyframes pop{to{opacity:1;transform:none}}

  /* 리스트 행 */
  .rows{border-top:1px solid var(--hair)}
  .row{display:flex;align-items:center;gap:var(--s4);padding:var(--s5) 0;border-bottom:1px solid var(--hair)}
  .row .tx{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
  .row .ar{margin-left:auto;color:var(--t4);font-size:var(--fs-t)}

  /* 숫자 */
  .nums{display:grid;grid-template-columns:1fr;gap:1px;background:var(--hair);border-radius:var(--r-lg);overflow:hidden}
  .nums > div{background:var(--surf);padding:var(--s6) var(--s5)}
  .nums b{display:block;font-size:var(--fs-d3);font-weight:700;line-height:var(--lh3);color:var(--t1);font-variant-numeric:tabular-nums}
  .nums span{display:block;font-size:var(--fs-m);font-weight:600;color:var(--t3);margin-top:var(--s3)}
  @media (min-width:760px){.nums{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:1024px){.nums > div{padding:var(--s9) var(--s8)}}

  /* 폰 목업 */
  .phone{width:min(300px,84vw);border-radius:32px;background:#0E1116;border:1px solid var(--hair);padding:var(--s2);box-shadow:var(--shadow);max-height:100%}
  .phone .scr{border-radius:var(--r-lg);background:#111419;overflow:hidden}
  .phone .ph-h{padding:var(--s3) var(--s4);border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:var(--s2)}
  .phone .ph-h b{font-size:var(--fs-m);font-weight:600;color:var(--t1)}
  .phone .ph-h .tg{margin-left:auto;font-size:var(--fs-mock);font-weight:500;letter-spacing:var(--ls);color:var(--t4);border:1px solid var(--hair);border-radius:var(--r-sm);padding:2px 8px;line-height:var(--lh5)}
  .vr{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--hair)}
  .vr:last-of-type{border-bottom:0}
  .vr .dot{width:5px;height:5px;border-radius:50%;flex:none}
  .vr .dot.p{background:var(--ok)}.vr .dot.l{background:rgba(255,255,255,.16)}
  .vr .tx{display:flex;flex-direction:column;min-width:0}
  .vr .nm{font-size:var(--fs-m);font-weight:600;color:var(--t1)}
  .vr .sb{font-size:var(--fs-mock);font-weight:500;color:var(--t4);margin-top:var(--s1)}
  .vr .v{margin-left:auto;font-size:var(--fs-mock);font-weight:600;white-space:nowrap;color:var(--t3)}
  .vr .v.ok{color:var(--ok)}
  .vr.lk .nm{color:rgba(255,255,255,.24)}.vr.lk .sb{color:rgba(148,163,184,.22)}
  .phone .ph-f{padding:var(--s3) var(--s4);border-top:1px solid var(--hair);font-size:var(--fs-mock);font-weight:500;color:var(--t3)}
  .phone .ph-f b{color:var(--key)}

  /* 변호사 */
  .lw{display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap}
  .lw .ph{width:80px;height:80px;border-radius:50%;flex:none;background:var(--surf2);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:var(--fs-d3);font-weight:700;color:var(--t3);overflow:hidden}
  /* 실사 변호사 사진. 원본 배경(법무법인 현암 백드롭)은 지우고 지면색 위에 다시 앉혔다 */
  .lw .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .lw .tx{display:flex;flex-direction:column;gap:var(--s1)}

  /* FAQ */
  .qa{border-bottom:1px solid var(--hair)}
  .qa button.q{width:100%;text-align:left;font-size:var(--fs-b);font-weight:600;padding:var(--s5) 0;display:flex;justify-content:space-between;gap:var(--s3);align-items:center;color:var(--t1);min-height:48px}
  .qa .cv{color:var(--t4);transition:transform .25s var(--e-st);font-size:var(--fs-m);flex:none}
  .qa.open .cv{transform:rotate(180deg)}
  .qa .a{max-height:0;overflow:hidden;transition:max-height var(--t-slow) var(--e-st)}
  .qa.open .a{max-height:320px}
  .qa .a p{font-size:var(--fs-b);font-weight:500;color:var(--t3);padding-bottom:var(--s5)}

  /* 아티클 */
  .art{display:flex;flex-direction:column;gap:var(--s5)}
  .art h2{font-size:var(--fs-d3);font-weight:700;line-height:var(--lh3);color:var(--t1);margin-top:var(--s8)}
  .art p{font-size:var(--fs-b);font-weight:500;line-height:var(--lh5);color:var(--t2)}
  .art .lead{font-size:var(--fs-t);font-weight:600;line-height:var(--lh4);color:var(--t1)}
  .art .quote{border-left:2px solid var(--key);padding-left:var(--s5);font-size:var(--fs-t);font-weight:600;color:var(--t1);line-height:var(--lh4)}
  .art .thumb{height:200px;border-radius:var(--r);background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--t4);font-size:var(--fs-m)}
  .toc{background:var(--surf);border:1px solid var(--hair);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
  .toc a{font-size:var(--fs-m);font-weight:600;color:var(--t3);padding:var(--s1) 0}

  /* 표 */
  .tw{overflow-x:auto;border:1px solid var(--hair);border-radius:var(--r)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:var(--fs-m)}
  th,td{padding:var(--s4);text-align:left;border-bottom:1px solid var(--hair);font-weight:500}
  th{background:var(--surf);color:var(--t3);font-weight:700;white-space:nowrap}
  td:first-child{color:var(--t1);font-weight:600;white-space:nowrap}
  tr:last-child td{border-bottom:0}

  /* 폼 */
  .form{display:flex;flex-direction:column;gap:var(--s3)}
  .fi label{display:block;font-size:var(--fs-m);font-weight:600;color:var(--t3);margin-bottom:var(--s2)}
  .fi input,.fi select{width:100%;background:var(--surf);border:1px solid var(--hair2);border-radius:var(--r);padding:var(--s4);font-size:var(--fs-b);color:var(--t1);min-height:48px}
  .fi input::placeholder{color:var(--t4)}
  .fi input:focus,.fi select:focus{outline:none;border-color:var(--key)}
  .fi input.err{border-color:var(--warn)}
  /* 동의는 전환 필수 컨트롤 — 라벨 전체를 44px 탭 영역으로 준다 */
  .agree{display:flex;gap:var(--s2);align-items:center;min-height:44px;padding:var(--s2) 0;cursor:pointer;
    font-size:var(--fs-m);font-weight:500;color:var(--t3)}
  .agree input{width:22px;height:22px;flex:none;accent-color:var(--key);cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .chips button{border:1px solid var(--hair2);border-radius:var(--r-pill);padding:0 var(--s4);min-height:48px;font-size:var(--fs-b);font-weight:600;color:var(--t2)}
  .chips button.on{border-color:var(--key);color:var(--key)}

  /* 진단 */
  .flow{min-height:100svh;display:flex;flex-direction:column}
  .qtop{position:sticky;top:0;background:var(--bg);z-index:20;padding-top:var(--s4)}
  .qtop > .in{max-width:var(--w-art);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;gap:var(--s3)}
  .qtop button{font-size:24px;font-weight:600;line-height:var(--lh1);color:var(--t3);padding:0 var(--s2) 0 0;min-height:48px;min-width:44px;text-align:left}
  .qtop .n{font-size:var(--fs-m);font-weight:600;color:var(--t3);font-variant-numeric:tabular-nums}
  .qtop .n em{font-style:normal;color:var(--t1)}
  .rail{height:2px;background:var(--hair);margin-top:var(--s3);position:relative}
  .rail i{position:absolute;left:0;top:0;height:2px;background:var(--key);transition:width var(--t-slow) var(--e-st)}
  .qmid{flex:1;display:flex;align-items:center;padding:var(--panel-pad) 0}
  .qmid > .in{max-width:var(--w-art);margin:0 auto;padding:0 var(--pad);width:100%}
  .qstep{animation:qi .3s var(--e-in)}
  @keyframes qi{from{opacity:0;transform:translateX(var(--s5))}to{opacity:1;transform:none}}
  .qstep.bk{animation:qib .3s var(--e-in)}
  @keyframes qib{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
  .opts{display:grid;grid-template-columns:1fr;gap:var(--s2);margin-top:var(--s8)}
  @media (min-width:620px){.opts.two{grid-template-columns:1fr 1fr}}
  .opt{display:flex;align-items:center;gap:var(--s3);text-align:left;background:var(--surf);border:1px solid var(--hair);border-radius:var(--r);padding:var(--s5);min-height:48px;transition:background var(--t-slow) ease,border-color var(--t-slow) ease,transform .2s var(--spring)}
  .opt:active{transform:scale(.97)}
  .opt:hover{box-shadow:var(--glow);border-color:var(--hair2)}
  .opt.sel{border-color:var(--key)}
  .opt .l{font-size:var(--fs-b);font-weight:600;color:var(--t1)}
  .opt .r{margin-left:auto;font-size:var(--fs-m);font-weight:500;color:var(--t4)}
  .anly{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;align-items:center;justify-content:center;text-align:center;padding:0 var(--pad)}
  .anly.on{display:flex}
  .anly .bars{display:flex;gap:var(--s1);justify-content:center;margin-bottom:var(--s6)}
  .anly .bars i{width:3px;height:28px;background:var(--key);opacity:.25;animation:bp 1.1s infinite}
  .anly .bars i:nth-child(2){animation-delay:.12s}.anly .bars i:nth-child(3){animation-delay:.24s}.anly .bars i:nth-child(4){animation-delay:.36s}
  @keyframes bp{0%,100%{opacity:.22;transform:scaleY(.55)}50%{opacity:1;transform:scaleY(1)}}

  /* 결과 */
  .res{max-width:var(--w-read);margin:0 auto;padding:calc(64px + var(--s8)) var(--pad) var(--s11);display:flex;flex-direction:column;gap:var(--s6)}
  .rep{border:1px solid var(--hair);border-radius:var(--r);background:var(--surf);overflow:hidden}
  .rep .ph-h{padding:var(--s4) var(--s5)}
  .rep .ph-h b{font-size:var(--fs-b)}
  .rep .ph-h .tg{font-size:var(--fs-m);font-weight:500}
  .rep .vr{padding:var(--s4) var(--s5)}
  .rep .vr .nm{font-size:var(--fs-b)}
  .rep .vr .sb{font-size:var(--fs-m);color:var(--t3)}
  .rep .vr .v{font-size:var(--fs-m)}
  .rep .ph-f{padding:var(--s3) var(--s5);font-size:var(--fs-m)}
  .stp{display:flex;gap:var(--s3);padding:var(--s5) 0;border-bottom:1px solid var(--hair)}
  .stp .n{font-size:var(--fs-m);font-weight:700;color:var(--key);font-variant-numeric:tabular-nums;flex:none;width:var(--s5);line-height:var(--lh4)}
  .stp .tx{display:flex;flex-direction:column;gap:var(--s1)}

  /* ══ 인터랙션① 스크롤 스테이지 (결과 화면 1곳만) ══ */
  .stagewrap{height:280vh;position:relative}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;
    background:radial-gradient(70% 55% at 20% 15%,rgba(245,165,36,.13),transparent 60%),
               radial-gradient(60% 50% at 85% 80%,rgba(96,165,250,.11),transparent 62%),#0E1116}
  .sin{max-width:var(--w-page);margin:0 auto;padding:0 var(--pad);width:100%;display:grid;grid-template-columns:1fr;gap:var(--s8);align-items:center}
  @media(min-width:900px){.sin{grid-template-columns:1fr 1fr}}
  .scopy{will-change:transform}
  .samt{font-size:clamp(34px,6.6vw,76px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--t1);
        font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:var(--s3)}
  .samt small{font-size:.42em;font-weight:600;color:var(--t3);margin-left:6px}
  .sbar{margin-top:var(--s8);height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;max-width:400px}
  .sbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--warn),var(--key),var(--ok))}
  #stCard{will-change:transform;box-shadow:var(--lift),var(--hl)}
  .srow{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) 0;border-bottom:1px solid var(--hair)}
  .srow:last-child{border-bottom:0}
  .sprog{position:absolute;left:var(--pad);bottom:var(--s8);display:flex;gap:6px}
  .sprog i{width:26px;height:3px;border-radius:999px;background:rgba(255,255,255,.16);transition:background var(--t-slow) var(--e-st)}
  .sprog i.on{background:var(--key)}
  @media (prefers-reduced-motion:reduce){.stagewrap{height:auto}.stage{position:static;height:auto;padding:var(--s12) 0}}

  /* ══ 장치 A — 고민 체크리스트 (선택 → 카운트 → 전환) ══ */
  .chk{display:grid;grid-template-columns:1fr;gap:var(--s2)}
  @media(min-width:700px){.chk{grid-template-columns:1fr 1fr}}
  .chk button{display:flex;align-items:center;gap:var(--s3);text-align:left;padding:var(--s4);border-radius:var(--r);
    background:var(--surf2);border:1px solid transparent;min-height:60px;
    transition:background var(--t-slow) ease,border-color var(--t-slow) ease,transform .2s var(--spring)}
  .chk button:active{transform:scale(.985)}
  .chk .bx{width:22px;height:22px;border-radius:6px;flex:none;border:1.5px solid var(--hair2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;
    transition:background var(--t-slow) ease,border-color var(--t-slow) ease,color var(--t-slow) ease}
  .chk button.on{background:rgba(245,165,36,.09);border-color:rgba(245,165,36,.45)}
  .chk button.on .bx{background:var(--key);border-color:var(--key);color:#0B0D10}
  .chk .tx{font-size:var(--fs-b);font-weight:600;color:var(--t1)}
  .chkbar{display:flex;align-items:center;gap:var(--s4);padding:var(--s5);border-radius:var(--r);
    background:var(--surf);border:1px solid var(--hair);box-shadow:var(--lift-sm),var(--hl);flex-wrap:wrap;
    transition:background var(--t-slow) ease,border-color var(--t-slow) ease}
  .chkbar .cnum{font-size:var(--fs-d3);font-weight:700;color:var(--t4);font-variant-numeric:tabular-nums;line-height:1;
    transition:color var(--t-slow) ease}
  .chkbar.hot{border-color:rgba(245,165,36,.4)}
  .chkbar.hot .cnum{color:var(--key)}

  /* ══ 장치 B — 골든타임 타임라인 (연체일수 → 사라지는 선택지) ══ */
  .tl{display:flex;flex-direction:column;gap:var(--s5)}
  .tlbar{position:relative;height:44px;display:flex;align-items:center}
  /* 네이티브 range 는 thumb 중심이 13px~(폭-13px)만 이동한다. 트랙·눈금을 같은 만큼 들여 맞춘다 */
  .tlbar .track{position:absolute;left:13px;right:13px;height:4px;border-radius:999px;
    background:linear-gradient(90deg,rgba(74,222,128,.28),rgba(245,165,36,.28),rgba(248,113,113,.28))}
  /* 전체 폭 그라디언트를 깔고 지나온 만큼만 잘라 보여준다 — 색이 실제 위치에 고정된다 */
  .tlbar .track::after{content:'';position:absolute;inset:0;border-radius:999px;
    background:linear-gradient(90deg,var(--ok),var(--key),var(--warn));
    clip-path:inset(0 calc(100% - var(--p,0%)) 0 0)}
  .tlbar input{position:relative;width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:44px;cursor:pointer}
  .tlbar input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid var(--key);box-shadow:var(--lift-sm);cursor:grab}
  .tlbar input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--key)}
  /* 눈금은 실제 비율 위치에 고정한다. space-between 이면 라벨이 실제 지점과 어긋난다 */
  .tlticks{position:relative;height:20px;margin:0 13px;font-size:var(--fs-m);font-weight:600;color:var(--t4)}
  .tlticks span{position:absolute;top:0;left:var(--x);transform:translateX(-50%);white-space:nowrap}
  .tlticks span:first-child{transform:none}
  .tlticks span:last-child{transform:translateX(-100%)}
  .tlopt{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-radius:var(--r);background:var(--surf2);
    border:1px solid transparent;transition:opacity var(--t-slow) var(--e-st),filter var(--t-slow) var(--e-st),background var(--t-slow) ease}
  .tlopt .nm{font-size:var(--fs-b);font-weight:600;color:var(--t1)}
  .tlopt .cond{margin-left:auto;font-size:var(--fs-m);font-weight:500;color:var(--t4)}
  .tlopt.gone{opacity:.3;filter:grayscale(1)}
  .tlopt.gone .cond{text-decoration:line-through}
  .tlnow{font-size:var(--fs-t);font-weight:700;color:var(--t1)}
  .tlnow em{font-style:normal;color:var(--key)}

  /* ══ 장치 C — 사례 before/after 바 ══ */
  .ba{display:flex;flex-direction:column;gap:var(--s3)}
  .barow{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s5);border-radius:var(--r);
    background:var(--surf2);border:1px solid transparent}
  .batop{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
  .batop .t{font-size:var(--fs-b);font-weight:600;color:var(--t1)}
  .batop .k{margin-left:auto;font-size:var(--fs-t);font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
  .batrack{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
  .batrack i{position:absolute;left:0;top:0;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--warn),var(--key));width:0;transition:width var(--t-draw) var(--e-in)}
  .go .batrack i{width:var(--w,100%)}
  .go>*:nth-child(1) .batrack i{transition-delay:.20s}.go>*:nth-child(2) .batrack i{transition-delay:.29s}
  .go>*:nth-child(3) .batrack i{transition-delay:.38s}.go>*:nth-child(4) .batrack i{transition-delay:.47s}
  .nomo .batrack i{transition:none}
  .bameta{display:flex;justify-content:space-between;font-size:var(--fs-m);font-weight:500;color:var(--t4)}

  /* ══ 장치 D — 변호사 자격 검증 행 (신원을 증명으로 보여준다) ══ */
  .vf{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s6)}
  .vfrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) 0;border-top:1px solid var(--hair)}
  .vfrow:first-child{border-top:0}
  .vfrow .lb{font-size:var(--fs-m);font-weight:600;color:var(--t3);min-width:96px;flex:none}
  .vfrow .vl{font-size:var(--fs-b);font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums}
  .vfrow .ck{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-m);
    font-weight:600;color:var(--ok);flex:none}
  .vfrow .ck::before{content:'';width:16px;height:16px;border-radius:50%;background:rgba(74,222,128,.16);
    box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.55)}

  /* ══ 장치 E — 비대면 진행 레일 (연결선이 있는 3단계) ══ */
  /* .rail 은 이미 퀴즈 진행바가 쓰고 있다 — .steps 로 분리 */
  .steps{display:grid;gap:var(--s6);margin-top:var(--s6)}
  @media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
  .sstep{position:relative;display:flex;flex-direction:column;gap:var(--s2);padding-top:36px}
  .sstep::before{content:'';position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;
    background:var(--surf2);box-shadow:inset 0 0 0 1.5px var(--hair2)}
  .sstep::after{content:'';position:absolute;top:6px;left:14px;right:0;height:2px;background:var(--hair)}
  .sstep:last-child::after{display:none}
  @media(max-width:759px){.sstep{padding-left:28px;padding-top:0}
    .sstep::after{left:6px;top:18px;right:auto;width:2px;height:calc(100% + var(--s6) - 18px)}}
  .sstep.on::before{background:var(--key);box-shadow:none}
  .sstep .rn{font-size:var(--fs-m);font-weight:700;color:var(--key);font-variant-numeric:tabular-nums}
  .sstep .rt{font-size:var(--fs-t);font-weight:700;color:var(--t1)}
  .sstep .rd{font-size:var(--fs-m);font-weight:500;color:var(--t3);line-height:var(--lh5)}

  /* 스크럽 중 자릿수가 흔들리지 않게 */
  .num{font-variant-numeric:tabular-nums}

  /* ══════ 지면(GROUND) 변주 ══════
     토스 실측: 한 페이지에서 배경이 18번 바뀐다 (흰→회→검정→사진).
     우리는 전 구간 #0B0D10 하나였다 — 장치를 바꿔도 "같은 방"이라 결이 같았다.
     아래 4종 지면을 섹션에 배분해 방 자체를 바꾼다. ══════ */

  /* 지면 2 — 한 톤 올린 면. 위아래 섹션과 미세하게 분리된다 */
  .sec.g-lift{background:#12151B;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}

  /* 지면 3 — 풀블리드 사진. 문틈 모티프(우측 빛줄기)와 맞는 컷만 쓴다 */
  .sec.g-photo{position:relative;background:#000;overflow:hidden}
  .sec.g-photo::before{content:'';position:absolute;inset:0;background:var(--ph) center/cover no-repeat;
    opacity:.55}
  /* 좌측을 눌러 글이 읽히게. 사진은 우측 빛줄기만 살린다 */
  .sec.g-photo::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.78) 42%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.55) 100%)}
  .sec.g-photo > *{position:relative;z-index:1}
  /* 사진 구간은 글을 왼쪽에 모아 오른쪽 빛줄기를 비워둔다 */
  @media(min-width:1080px){.sec.g-photo .wrap > *{max-width:660px}
    .sec.g-photo .chk{grid-template-columns:1fr}}
  @media(max-width:759px){.sec.g-photo::before{opacity:.4}
    .sec.g-photo::after{background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.72) 55%,rgba(0,0,0,.9))}}

  /* 지면 4 — 반전. 어두운 사이트에서 유일하게 밝은 방이라 가장 세게 눈에 띈다.
     여기 놓는 내용은 "사실"이어야 한다 — 통계처럼 색을 안 써도 되는 것. */

  /* ══════ 장면(SCENE) ══════
     토스의 블록은 "둥근 사각형 + 텍스트"가 아니다. 깊이가 다른 물체가 떠 있는 작은 무대다.
     떠 있는 칩 / 그림자로 만든 층 / 실제 그려지는 물체 / 우하단 원형 버튼.
     우리 도메인의 물건(사람 점, 독촉 알림, 서류)으로 같은 걸 만든다. ══════ */
  /* 장면은 기본 지면과 같은 어둠이라 그냥 두면 경계가 사라진다.
     아주 미세한 톤차 + 헤어라인 + 안쪽 광원으로 "떠 있는 판"이 되게 한다 */
  .scene{position:relative;border-radius:var(--r-xl);overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,#14181F 0%,#0A0C0F 70%);
    border:1px solid var(--hair);box-shadow:var(--lift),var(--hl);
    min-height:360px;isolation:isolate}
  @media(min-width:900px){.scene{min-height:440px}}
  .scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ══════════════ 변제금 계산 엔진 ══════════════
   sinyong-toktok-lead 의 best-case-calculator.ts / eligibility-engine.ts 를
   그대로 옮긴 것. 상수와 산식을 바꾸지 말 것 — 바꾸려면 원본과 함께 고쳐야 한다.

     변제금 = max(가용소득 × 36개월, 청산가치)
     가용소득 = 월소득 − (가구원수별 생계비 × 1.10)
     가용소득 ≤ 0 이면 가구원 수를 1씩 줄여가며 양수 지점을 찾는다
     변제율 5% 미만이면 강제 상향 (법원 실무상 인가 어려움)
   ══════════════════════════════════════════ */

/* 보건복지부 고시 제2025-135호 (2026년 적용) */
const MEDIAN_INCOME={1:2564238,2:4199292,3:5359036,4:6494738,5:7556719,6:8555952,7:9515150};
const EXTRA_PER_PERSON=580000;      // 8인 이상: 7인 + 인당 58만
const LIVING_COST_RATIO=0.6;        // 생계비 = 중위소득 60%
const LIVING_COST_BUFFER=1.10;      // 의료비·임대료 등 추가 공제 버퍼 → 보수적으로 잡는다
const REPAYMENT_MONTHS=36;
const MIN_REPAYMENT_RATE=0.05;
const DEBT_MIN=10000000, DEBT_MAX_UNSECURED=1000000000, DEBT_MAX_SECURED=1500000000;

const medianIncome=n=>{const s=Math.max(1,n);
  return s<=7? MEDIAN_INCOME[s] : MEDIAN_INCOME[7]+(s-7)*EXTRA_PER_PERSON;};
const livingCostOf=n=>Math.round(medianIncome(n)*LIVING_COST_RATIO);
const MIN_INCOME_FOR_ELIGIBILITY=Math.round(MEDIAN_INCOME[1]*LIVING_COST_RATIO); // 1,538,543원

const roundClean=a=>a>=10000000?Math.round(a/1000000)*1000000
                  :a>=1000000 ?Math.round(a/100000)*100000
                              :Math.round(a/10000)*10000;
const roundMonthly=a=>Math.floor(a/1000)*1000;

function calcBestCase(inp){
  const {monthlyIncome,householdSize,totalDebt,assetValue,hasSecuredDebt}=inp;
  const debtLimit=hasSecuredDebt?DEBT_MAX_SECURED:DEBT_MAX_UNSECURED;
  const liquidationValue=Math.max(0,assetValue);

  const inelig=reason=>({originalDebt:totalDebt,estimatedRepayment:0,reductionAmount:0,
    reductionPercent:0,monthlyPayment:0,repaymentMonths:0,isEligible:false,
    ineligibilityReason:reason,livingCost:Math.round(livingCostOf(householdSize)*LIVING_COST_BUFFER),
    monthlyDisposable:0,disposableTotal:0,liquidationValue,determinedBy:'income',
    effectiveHouseholdSize:householdSize,isHouseholdAdjusted:false,isMinRepaymentApplied:false});

  if(totalDebt<DEBT_MIN) return inelig('TOO_LOW');
  if(totalDebt>debtLimit) return inelig('TOO_HIGH');

  /* 부양가족 자동 조절 — 가용소득이 양수가 되는 최대 가구원 수를 찾는다 */
  let size=householdSize;
  let livingCost=Math.round(livingCostOf(size)*LIVING_COST_BUFFER);
  let monthlyDisposable=monthlyIncome-livingCost;
  while(monthlyDisposable<=0 && size>1){
    size-=1;
    livingCost=Math.round(livingCostOf(size)*LIVING_COST_BUFFER);
    monthlyDisposable=monthlyIncome-livingCost;
  }
  if(monthlyDisposable<0) monthlyDisposable=0;   // 1인까지 줄여도 음수면 청산가치로만

  const disposableTotal=monthlyDisposable*REPAYMENT_MONTHS;
  let totalRepayment=Math.max(disposableTotal,liquidationValue);
  let determinedBy=disposableTotal>=liquidationValue?'income':'asset';

  /* 변제금이 채무 이상이면 회생 실익이 없다 */
  if(totalRepayment>=totalDebt) return {originalDebt:totalDebt,estimatedRepayment:totalDebt,
    reductionAmount:0,reductionPercent:0,monthlyPayment:roundMonthly(totalDebt/REPAYMENT_MONTHS),
    repaymentMonths:REPAYMENT_MONTHS,isEligible:false,ineligibilityReason:'NO_REDUCTION',
    livingCost,monthlyDisposable,disposableTotal,liquidationValue,determinedBy,
    effectiveHouseholdSize:size,isHouseholdAdjusted:size<householdSize,isMinRepaymentApplied:false};

  const minRepayment=Math.round(totalDebt*MIN_REPAYMENT_RATE);
  let isMinRepaymentApplied=false;
  if(totalRepayment<minRepayment){totalRepayment=minRepayment;determinedBy='min_rate';isMinRepaymentApplied=true;}

  const estimatedRepayment=Math.min(roundClean(totalRepayment),totalDebt);
  const reductionAmount=Math.max(0,totalDebt-estimatedRepayment);
  return {originalDebt:totalDebt,estimatedRepayment,reductionAmount,
    reductionPercent:totalDebt>0?Math.round(reductionAmount/totalDebt*100):0,
    monthlyPayment:roundMonthly(totalRepayment/REPAYMENT_MONTHS),
    repaymentMonths:REPAYMENT_MONTHS,isEligible:true,
    livingCost,monthlyDisposable,disposableTotal,liquidationValue,determinedBy,
    effectiveHouseholdSize:size,isHouseholdAdjusted:size<householdSize,isMinRepaymentApplied};
}

const wonStr=n=>n.toLocaleString('ko-KR')+'원';

function checkEligibility(inp){
  const calc=calcBestCase(inp);
  const hasJobIncome=inp.jobId!=='none';
  const incomeOk=hasJobIncome && inp.monthlyIncome>=MIN_INCOME_FOR_ELIGIBILITY;
  const debtLimit=inp.hasSecuredDebt?DEBT_MAX_SECURED:DEBT_MAX_UNSECURED;
  const debtOk=inp.totalDebt>=DEBT_MIN && inp.totalDebt<=debtLimit;
  const insolvencyOk=calc.liquidationValue<inp.totalDebt;

  const conditions=[
    {n:'소득 요건',s:'1인 최저생계비 이상',p:incomeOk?1:0,
     v:hasJobIncome?('월 '+wonStr(inp.monthlyIncome)):'정기 소득 없음'},
    {n:'채무 요건',s:'1천만 ~ 15억 원',p:debtOk?1:0,
     v:'총 '+wonStr(inp.totalDebt)},
    {n:'재산 대비 채무',s:'청산가치 판정',p:insolvencyOk?1:0,
     v:insolvencyOk?('재산 '+wonStr(calc.liquidationValue)):'재산이 채무보다 큼'},
    {n:'감액 가능성',s:'회생 실익 판정',p:calc.isEligible?1:0,
     v:calc.isEligible?('감액 '+wonStr(calc.reductionAmount)+' ('+calc.reductionPercent+'%)')
                      :'자력 변제 가능 — 회생 실익 작음'}
  ];
  return {isEligible:conditions.every(c=>c.p)&&calc.isEligible, conditions, calc};
}

/* ── 9문항 답(구간) → 엔진 입력(금액) 매핑 ──
   문항이 구간만 받으므로 구간의 대표값을 쓴다. 각 구간의 중앙값이며
   열린 구간(1억 이상 등)은 경계에서 한 단계 올린 값이다.
   실제 금액은 상담에서 확정된다 — 화면에도 그렇게 밝힌다. */
const MAP={
  debt:    [8000000, 20000000, 65000000, 150000000],        // Q0
  job:     ['employee','freelance','daily','none'],          // Q3
  income:  [1300000, 2000000, 3250000, 4800000],             // Q4
  house:   [1,2,3,4],                                        // Q5 부양가족 → 가구원 수
  asset:   [0, 30000000, 20000000, 80000000],                // Q6
  /* Q6 주의: '전·월세 보증금'이 '1천만~3천만'보다 클 수 있어 순서가 단조롭지 않다.
     소액임차보증금 일부는 면제재산이라 청산가치에서 빠지는데 문항으로는 구분이 안 된다.
     → 문항 자체를 금액 입력으로 바꾸는 게 맞다. 지금은 대표값으로 둔다. */
};

function buildInput(ans){
  const g=(i,arr,dflt)=>arr[ans[i]] !== undefined ? arr[ans[i]] : dflt;
  const jobId=g(3,MAP.job,'employee');
  return {
    jobId,
    monthlyIncome: jobId==='none' ? 0 : g(4,MAP.income,2000000),
    householdSize: g(5,MAP.house,1),
    totalDebt:     g(0,MAP.debt,20000000),
    assetValue:    g(6,MAP.asset,0),
    hasSecuredDebt: ans[6]===3,        // 자가·차량 → 담보 채무 가능성
  };
}

/* 햅틱 — sinyong-toktok/lib/utils/haptic.ts 이식 */
const HAP={light:()=>navigator.vibrate&&navigator.vibrate(8),
           medium:()=>navigator.vibrate&&navigator.vibrate(15),
           success:()=>navigator.vibrate&&navigator.vibrate([10,40,10])};

/* 히어로 영상 — poster 우선, 조건 미달 시 Ken Burns 유지 */
function heroMedia(){
  const v=document.getElementById('heroVid'), img=document.getElementById('heroImg');
  if(!v||!img) return;
  const src=v.dataset.src;                       // 실촬 확보 시 data-src 주입
  if(!src||RM||LOWDATA){ if(RM) img.style.animation='none'; return; }
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    io.disconnect(); v.src=src; v.load();
    v.addEventListener('canplay',()=>{v.play().then(()=>v.classList.add('ready')).catch(()=>{});},{once:true});
  }),{threshold:.1});
  io.observe(v);
}

function bind(key){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('shown');io.unobserve(e.target);}}),{threshold:.1});

  /* 순차 등장 90ms */
  if(RM){document.querySelectorAll('[data-seq]').forEach(e=>e.classList.add('go','nomo'));}
  else{const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('go');so.unobserve(e.target);}}),{threshold:.2});
    document.querySelectorAll('[data-seq]').forEach(e=>so.observe(e));}
  heroMedia();
  document.querySelectorAll('.qa .q').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));

/* ?audit 으로 열면 대비를 계산해 콘솔에 찍는다.
   밝은 면(패널·반전 카드)이 생긴 뒤로 "흰 글자가 흰 바닥에" 사고가 실제로 났다. */
function audit(){
  const parse=c=>{const m=(c||'').match(/[\d.]+/g); if(!m)return null;
    return [+m[0],+m[1],+m[2], m[3]===undefined?1:+m[3]];};
  /* 반투명은 뒤 색과 합성해야 한다. 알파를 무시하면 비율 1 같은 헛것이 나온다 */
  const over=(f,b)=>[0,1,2].map(i=>f[i]*f[3]+b[i]*(1-f[3])).concat(1);
  const lum=([r,g,b])=>{const v=[r,g,b].map(x=>{x/=255;
      return x<=.03928? x/12.92 : Math.pow((x+.055)/1.055,2.4);});
    return .2126*v[0]+.7152*v[1]+.0722*v[2];};
  const ROOT=[11,13,16,1];
  const bgOf=el=>{const stack=[]; let n=el;
    while(n&&n!==document.documentElement){const c=parse(getComputedStyle(n).backgroundColor);
      if(c&&c[3]>0)stack.push(c); n=n.parentElement;}
    return stack.reduceRight((acc,c)=>over(c,acc), ROOT);};
  /* 조상 opacity 누적 — 일부러 흐리게 한 요소(.gone)는 대비 대상이 아니다 */
  const effOpacity=el=>{let o=1,n=el; while(n&&n!==document.documentElement){
    o*=parseFloat(getComputedStyle(n).opacity)||1; n=n.parentElement;} return o;};
  const bad=[];
  document.querySelectorAll('body *').forEach(e=>{
    if(!e.offsetParent||e.childElementCount||!e.textContent.trim())return;
    if(effOpacity(e)<0.7)return;
    const c=getComputedStyle(e); const fg=parse(c.color); if(!fg)return;
    /* 일부러 지운 것들은 대비 대상이 아니다:
       투명 글자(체크 안 된 체크박스 글리프), 잠금 표시로 흐려둔 행 */
    if(fg[3]<0.5)return;
    const bg=bgOf(e);
    const L1=lum(over(fg,bg)), L2=lum(bg);
    const ratio=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
    const size=parseFloat(c.fontSize), need=(size>=24||(size>=18.66&&+c.fontWeight>=700))?3:4.5;
    if(ratio<need) bad.push({el:e.className||e.tagName, text:e.textContent.trim().slice(0,16),
      ratio:+ratio.toFixed(2), need, color:c.color,
      bg:'rgb('+bg.slice(0,3).map(Math.round).join(',')+')'});});
  if(bad.length){console.warn('대비 미달 '+bad.length+'건');console.table(bad);}
  else console.log('대비 전항 통과');
  return bad;
}
window.audit=audit;

/* 장면 1 — 10만 명 점 필드.
   점 하나 = 20명, 5,000점. 그중 하루치(274명 ≈ 14점)만 호박색으로 켠다.
   숫자를 글자로 적는 대신 실제로 그려서 규모가 몸으로 오게 한다. */
function initDots(){
  const cv=document.getElementById('dots'); if(!cv)return;
  const box=cv.parentElement, g=cv.getContext('2d');
  const TOTAL=5000, PER=20, DAY=Math.round(100000/365/PER); // 14점
  let W=0,H=0,pts=[],raf=0,t0=0;

  let ring=null;
  const layout=()=>{
    const r=box.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    g.setTransform(dpr,0,0,dpr,0,0);
    const padX=W*0.07, padY=H*0.12, iw=W-padX*2, ih=H-padY*2;
    const cols=Math.max(20,Math.round(Math.sqrt(TOTAL*iw/ih)));
    const rows=Math.ceil(TOTAL/cols);
    const gx=iw/(cols-1), gy=ih/(rows-1);
    /* 하루치는 한 줄로 흩어지면 "하루"로 안 읽힌다. 정사각에 가깝게 뭉친다 */
    const bw=Math.ceil(Math.sqrt(DAY)), bh=Math.ceil(DAY/bw);
    const bx=Math.round(cols*0.60), by=Math.round(rows*0.42);
    pts=[];
    for(let i=0;i<TOTAL;i++){
      const c=i%cols, rw=(i/cols)|0;
      const hot=(c>=bx&&c<bx+bw&&rw>=by&&rw<by+bh);
      pts.push({x:padX+c*gx, y:padY+rw*gy, hot,
        d:(c/cols)*0.55+(rw/rows)*0.45});   // 좌상→우하 순으로 켜진다
    }
    ring={x:padX+(bx+bw/2-.5)*gx, y:padY+(by+bh/2-.5)*gy,
      r:Math.max(bw*gx,bh*gy)*0.95+10};
  };

  const draw=ts=>{
    if(!t0)t0=ts;
    const p=RM?1:Math.min((ts-t0)/1400,1);
    g.clearRect(0,0,W,H);
    for(const pt of pts){
      const local=Math.min(Math.max((p-pt.d*0.5)/0.5,0),1);
      if(local<=0)continue;
      g.beginPath();
      g.arc(pt.x,pt.y,pt.hot?2.4:1.4,0,6.2832);
      g.fillStyle=pt.hot?`rgba(245,165,36,${local})`:`rgba(255,255,255,${0.22*local})`;
      g.fill();
    }
    /* 무리를 감싸는 링 — 어디를 보라는 지시 */
    if(ring&&p>0.55){
      const a=Math.min((p-0.55)/0.45,1);
      g.beginPath(); g.arc(ring.x,ring.y,ring.r,0,6.2832);
      g.strokeStyle=`rgba(245,165,36,${0.42*a})`; g.lineWidth=1.5; g.stroke();
      g.beginPath(); g.arc(ring.x,ring.y,ring.r+9,0,6.2832);
      g.strokeStyle=`rgba(245,165,36,${0.14*a})`; g.lineWidth=1; g.stroke();
    }
    if(p<1)raf=requestAnimationFrame(draw);
  };

  const start=()=>{layout(); t0=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(draw);};
  // 화면에 들어올 때 한 번만 그린다
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){start();io.disconnect();}}),{threshold:.25});
  io.observe(box);
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(start,180)});
}

/* 장치 A — 고민 체크리스트 */
function initChk(){
  const box=document.getElementById('chk');if(!box)return;
  const nEl=document.getElementById('chkN'),msg=document.getElementById('chkMsg'),bar=document.getElementById('chkbar');
  const MSG=['해당하는 게 없다면 아직 여유가 있습니다',
    '한 가지라도 해당되면 진단해볼 만합니다',
    '두 가지 이상이면 제도를 검토할 시점입니다',
    '세 가지 이상이면 지금이 골든타임입니다'];
  const sync=()=>{const n=box.querySelectorAll('button.on').length;
    nEl.textContent=n;msg.textContent=MSG[Math.min(n,3)];
    bar.classList.toggle('hot',n>=2);};
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));sync();});
  box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
  sync();
}
/* 장치 B — 골든타임 타임라인 */
function initTl(){
  const r=document.getElementById('tlRange');if(!r)return;
  const dEl=document.getElementById('tlDay'),cEl=document.getElementById('tlCred'),
        msg=document.getElementById('tlMsg'),opts=document.querySelectorAll('#tlList .tlopt');
  /* 선택지 개수는 시간에 따라 줄지 않는다(워크아웃은 90일부터 열린다).
     단조롭게 나빠지는 건 신용·추심 쪽이라 그걸 지표로 쓴다. */
  const sync=()=>{const d=+r.value;
    opts.forEach(o=>{const mx=o.dataset.max,mn=o.dataset.min;
      let ok=true;
      if(mx!==undefined)ok=d<=+mx;
      if(mn!==undefined)ok=d>=+mn;
      o.classList.toggle('gone',!ok);});
    dEl.textContent=d;
    cEl.textContent = d===0?'신용 정상' : d<90?'신용점수 하락' : '채무불이행 등록 · 압류 가능';
    cEl.style.color = d===0?'var(--ok)' : d<90?'var(--key)' : 'var(--warn)';
    r.parentElement.style.setProperty('--p',(d/180*100).toFixed(1)+'%');
    msg.textContent = d===0 ? '아직 신용에 흠이 없습니다. 가장 가벼운 조정으로 끝날 수 있는 구간입니다.'
      : d<=30 ? '신속채무조정을 쓸 수 있는 마지막 구간입니다. 30일이 지나면 이 선택지는 닫힙니다.'
      : d<90 ? '신속채무조정 기한은 지났습니다. 개인회생·파산은 소득과 재산 기준으로 판단합니다.'
      : '연체 90일이면 신용은 이미 손상됐습니다. 금지명령으로 추심부터 멈추는 게 먼저입니다.';
  };
  r.oninput=()=>{sync();if(+r.value%30===0)HAP.light();};
  sync();
}
function renderQ(dir){
  const s=QS[qi],box=document.getElementById('qbox');
  document.getElementById('qn').textContent=qi+1;
  document.getElementById('rf').style.width=((qi+1)/9*100).toFixed(1)+'%';
  box.innerHTML='';
  const st=el(`<div class="qstep ${dir==='bk'?'bk':''}"><h2 class="d2">${s.q}</h2>
    <div class="opts ${s.two?'two':''}">${s.o.map((o,i)=>`<button class="opt" data-i="${i}" data-h="light"><span class="l">${o[0]}</span>${o[1]?`<span class="r">${o[1]}</span>`:''}</button>`).join('')}</div></div>`);
  box.appendChild(st);
  st.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    st.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');ans[qi]=+o.dataset.i;
    setTimeout(()=>{if(qi<8){qi++;renderQ();}else finish();},220);});
}
/* 폼 제출 — 저장에 성공했을 때만 "접수됐습니다"로 보낸다.
   실패했는데 접수됐다고 말하면, 사용자는 오지 않을 전화를 기다리게 된다. */
async function submitLead(form, payload){
  const btn=form.querySelector('button[type=submit]');
  const label=btn.textContent;
  let err=form.querySelector('.formerr');
  if(!err){ err=el('<p class="formerr fine" role="alert"></p>'); form.appendChild(err); }
  err.textContent='';

  if(recentlySent(payload.phone)){
    /* 이미 보낸 번호 — 중복 저장 대신 완료 화면으로 넘긴다 */
    sessionStorage.setItem('kn',payload.name); go('#/done'); return;
  }

  btn.disabled=true; btn.textContent='보내는 중…';
  try{
    await sendLead({...payload, consent:true, consent_at:new Date().toISOString()});
    sessionStorage.setItem('kn',payload.name);
    go('#/done');
  }catch(e){
    btn.disabled=false; btn.textContent=label;
    err.textContent='전송에 실패했습니다. 잠시 후 다시 시도하시거나 '+BIZ.tel+' 로 전화 주세요.';
    err.classList.add('bad');
    console.error('lead submit failed:', e.message);
  }
}

/* 진단 결과 — 답이 바뀔 때마다 다시 계산해 여기 담는다 */
let RESULT=null;

function finish(){
  RESULT=checkEligibility(buildInput(ans));
  /* let 은 window 에 안 붙는다. 콘솔에서 판정 근거를 확인할 수 있게 노출한다 */
  window.RESULT=RESULT;
  const az=document.getElementById('anly');az.classList.add('on');
  setTimeout(()=>{az.classList.remove('on');go('#/result');},1500);}

/* 스크롤 스테이지 스크럽 — 채무 → 변제금.
   진단을 거치지 않고 /result 로 직접 들어온 경우를 위한 기본값. */
const DEMO_DEBT=88300000, DEMO_PAY=14600000, DEMO_MON=405000;
let DEBT=DEMO_DEBT, PAY=DEMO_PAY, MON=DEMO_MON;
const won=n=>n.toLocaleString('ko-KR'), man=n=>Math.round(n/10000).toLocaleString('ko-KR')+'만';
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let stageFn=null;
function initStage(){
  const sw=document.getElementById('sw'); if(!sw)return;
  const capL=document.getElementById('capL'),card=document.getElementById('stCard'),
        amt=document.getElementById('amt'),bar=document.getElementById('barI'),
        rPay=document.getElementById('rPay'),rMon=document.getElementById('rMon'),rCut=document.getElementById('rCut'),
        lab=document.getElementById('stLabel'),sub=document.getElementById('stSub'),
        dots=document.querySelectorAll('.sprog i');
  if(RM){amt.textContent=won(PAY);rPay.textContent=man(PAY);rMon.textContent=won(MON)+'원';
         rCut.textContent=won(DEBT-PAY)+'원';bar.style.width=(PAY/DEBT*100).toFixed(1)+'%';
         lab.textContent='회생 후 변제 총액';sub.textContent='남은 채무는 면책됩니다';return;}
  let tick=false;
  stageFn=()=>{
    const r=sw.getBoundingClientRect(), total=sw.offsetHeight-innerHeight;
    const p=clamp(-r.top/total,0,1);
    capL.style.transform=`translateX(${(-16*p).toFixed(1)}px)`;
    card.style.transform=`scale(${lerp(1.07,1,clamp(p*1.6,0,1)).toFixed(3)})`;
    const cur=Math.round(lerp(DEBT,PAY,p));
    amt.textContent=won(cur); bar.style.width=lerp(100,PAY/DEBT*100,p).toFixed(1)+'%';
    rPay.textContent=man(cur);
    rMon.textContent=won(Math.round(lerp(DEBT/36,MON,p)))+'원';
    rCut.textContent=won(DEBT-cur)+'원';
    lab.textContent=p<0.35?'현재 채무':(p<0.85?'조정 중':'회생 후 변제 총액');
    sub.textContent=p<0.35?'스크롤하면 회생 후 예상 변제금으로 바뀝니다'
      :(p<0.85?'가용소득 36개월과 청산가치를 비교하는 중':'남은 채무는 면책됩니다');
    dots.forEach((d,i)=>d.classList.toggle('on',p>=i/3));
    tick=false;
  };
  const on=()=>{if(!tick){tick=true;requestAnimationFrame(stageFn);}};
  addEventListener('scroll',on,{passive:true}); addEventListener('resize',on,{passive:true});
  stageFn();
}

document.getElementById('dx').onclick=()=>document.getElementById('drawer').classList.remove('on');
document.getElementById('drawer').onclick=e=>{if(e.target.tagName==='A'||e.target.id==='drawer')document.getElementById('drawer').classList.remove('on');};

  const fb=document.getElementById('fbar');

window.addEventListener('hashchange',render);
