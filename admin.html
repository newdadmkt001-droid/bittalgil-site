/* ── 아주 작은 차트 두 개. 외부 스크립트를 안 쓰므로 SVG 로 직접 그린다 ── */
function areaChart(series,keys,colors,h){
  h=h||150; const W=760, P=26;
  const n=series.length||1;
  const max=Math.max(1,...series.flatMap(d=>keys.map(k=>d[k]||0)));
  const x=i=>P+(W-P*2)*(n===1?0.5:i/(n-1));
  const y=v=>h-20-(h-34)*(v/max);
  const path=k=>series.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[k]||0).toFixed(1)).join(' ');
  const fill=k=>path(k)+` L ${x(n-1).toFixed(1)} ${h-20} L ${x(0).toFixed(1)} ${h-20} Z`;
  const step=Math.max(1,Math.ceil(n/7));
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto">
    ${[0,.5,1].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(max*g).toFixed(1)}" y2="${y(max*g).toFixed(1)}"
      stroke="#E9EDF1" stroke-width="1"/><text x="0" y="${(y(max*g)+4).toFixed(1)}" font-size="11" fill="#8B95A1">${Math.round(max*g)}</text>`).join('')}
    ${keys.map((k,i)=>`<path d="${fill(k)}" fill="${colors[i]}" opacity=".12"/>
      <path d="${path(k)}" fill="none" stroke="${colors[i]}" stroke-width="2.2" stroke-linejoin="round"/>`).join('')}
    ${series.map((d,i)=>i%step?'':`<text x="${x(i).toFixed(1)}" y="${h-5}" font-size="11" fill="#8B95A1" text-anchor="middle">${d.label}</text>`).join('')}
  </svg>`;
}
function barChart(vals,labels){
  const W=760,h=130,P=26,n=vals.length,max=Math.max(1,...vals);
  const bw=(W-P*2)/n*0.68;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto">
    ${vals.map((v,i)=>{const bx=P+(W-P*2)*(i/n)+((W-P*2)/n-bw)/2, bh=(h-30)*(v/max);
      return `<rect x="${bx.toFixed(1)}" y="${(h-20-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}"
        rx="3" fill="#3182F6" opacity="${v?0.85:0.15}"/>`}).join('')}
    ${labels.map((l,i)=>i%3?'':`<text x="${(P+(W-P*2)*(i/n)+(W-P*2)/n/2).toFixed(1)}" y="${h-5}"
      font-size="11" fill="#8B95A1" text-anchor="middle">${l}</text>`).join('')}
  </svg>`;
}

/* ══ 세션 ══
   이벤트를 세션으로 접어 '어디까지 갔는가'를 만든다.
   신용톡톡 어드민의 퍼널·여정이 전부 이 위에 선다. */
/* 기간 — 커스텀이 있으면 그것이 우선한다 */
function within(ts){
  const t=new Date(ts);
  if(FROM&&TO)return t>=new Date(FROM+'T00:00:00')&&t<=new Date(TO+'T23:59:59');
  if(RANGE===0)return true;
  const d=new Date(); d.setDate(d.getDate()-RANGE); return t>=d;
}
const evInRange=()=>EVENTS.filter(e=>within(e.created_at)
  &&!EXCL.has(e.session_id)
  &&!(NOBOT&&BOT.test(e.referrer||'')));
const rangeLabel=()=>FROM&&TO?FROM+' ~ '+TO:RANGE===0?'전체':RANGE===1?'오늘':RANGE+'일';

/* 퍼널 단계 — 뒤에 있을수록 깊이 들어간 것 */
const STAGES=[
  ['view',   '사이트 진입'],
  ['q1',     '진단 시작'],
  ['q5',     '5번 문항 통과'],

  ['calc',   '계산 화면'],
  ['gate',   '연락처 입력칸'],

function sessions(){
  const m=new Map();
  evInRange().forEach(e=>{
    let x=m.get(e.session_id);
    if(!x){x={id:e.session_id,first:e.created_at,last:e.created_at,items:[],
      utm:e.utm_source||'직접',camp:e.utm_campaign||'없음',device:e.device||'미상',
      ref:e.referrer||'',maxQ:0,depth:0,scroll:0};m.set(e.session_id,x);}
    x.items.push(e);
    if(e.created_at>x.last)x.last=e.created_at;
    if(e.event==='q_enter'&&e.step>x.maxQ)x.maxQ=e.step;
    if(e.event==='scroll'&&e.step>x.scroll)x.scroll=e.step;
  });
  const idx=k=>STAGES.findIndex(s=>s[0]===k);
  m.forEach(x=>{
    let d=0;
    x.items.forEach(e=>{
      if(e.event==='view')d=Math.max(d,idx('view'));
      if(e.event==='q_enter'){ d=Math.max(d,idx('q1'));
        if(e.step>=5)d=Math.max(d,idx('q5'));
        if(e.step>=9)d=Math.max(d,idx('q9')); }
      if(e.event==='calc')d=Math.max(d,idx('calc'));
      if(e.event==='gate')d=Math.max(d,idx('gate'));
      if(e.event==='submit')d=Math.max(d,idx('submit'));
    });
    x.depth=d;
    x.sec=Math.max(0,Math.round((new Date(x.last)-new Date(x.first))/1000));
    x.tel=x.items.some(e=>e.event==='cta_tel');
    x.kakao=x.items.some(e=>e.event==='cta_kakao');
  });
  return [...m.values()].sort((a,b)=>new Date(b.first)-new Date(a.first));
}

/* ══ 집계 ══ */
const inRange=()=>LEADS.filter(l=>within(l.created_at));

function statsHTML(){
  const S=sessions();
  const rows=inRange();
  const n=rows.length;
  const ev=evInRange();

  /* 오늘 / 어제 — 전일 대비를 보여줘야 좋아졌는지 나빠졌는지 안다 */
  const dayKey=t=>new Date(t).toLocaleDateString('sv-SE');
  const today=new Date().toLocaleDateString('sv-SE');
  const yest=new Date(Date.now()-864e5).toLocaleDateString('sv-SE');
  const pv=EVENTS.filter(e=>e.event==='view'&&!EXCL.has(e.session_id));
  const cnt=(arr,d,f)=>arr.filter(x=>dayKey(x.created_at)===d&&(!f||f(x))).length;
  const uniq=(d)=>new Set(pv.filter(e=>dayKey(e.created_at)===d).map(e=>e.session_id)).size;
  const tV=cnt(pv,today), yV=cnt(pv,yest);
  const tS=uniq(today), yS=uniq(yest);
  const tL=cnt(LEADS,today), yL=cnt(LEADS,yest);
  const delta=(a,b)=>b===0?(a?'+'+a:'0'):((a-b>=0?'+':'')+(a-b));

  /* 일별 추이 */
  const days=[]; const span=FROM&&TO?Math.min(60,Math.round((new Date(TO)-new Date(FROM))/864e5)+1):(RANGE===0?30:Math.max(1,RANGE));
  for(let k=span-1;k>=0;k--){
    const d=new Date(Date.now()-k*864e5).toLocaleDateString('sv-SE');
    days.push({label:d.slice(5).replace('-','/'),
      visits:cnt(pv,d), sessions:uniq(d), leads:cnt(LEADS,d)});
  }
  /* 시간대 */
  const hours=Array(24).fill(0);
  ev.filter(e=>e.event==='view').forEach(e=>hours[new Date(e.created_at).getHours()]++);

  const grp=(list,key,fb)=>{const m={};list.forEach(x=>{const k=(typeof key==='function'?key(x):x[key])||fb;m[k]=(m[k]||0)+1});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  /* 유입 채널 — utm_source 가 없으면 referrer 도메인으로 대신한다 */
  const chan=x=>x.utm||(x.ref?(()=>{try{return new URL(x.ref).hostname.replace(/^www\./,'')}catch(e){return '직접'}})():'직접');
  const bySrc={}; S.forEach(x=>{const k=chan(x);(bySrc[k]=bySrc[k]||{v:0,l:0}).v++;});
  rows.forEach(l=>{const k=l.utm_source||'직접';(bySrc[k]=bySrc[k]||{v:0,l:0}).l++;});

  /* 칼럼별 기여 — 어떤 글이 진단으로 데려오는가 */
  const art={};
  ev.filter(e=>e.event==='view'&&/#\/columns\/[a-z0-9-]+/.test(e.path||'')).forEach(e=>{
    const slug=(e.path.match(/#\/columns\/([a-z0-9-]+)/)||[])[1]; if(!slug)return;
    (art[slug]=art[slug]||{v:0,sess:new Set()});
    art[slug].v++; art[slug].sess.add(e.session_id);
  });
  const startedSess=new Set(ev.filter(e=>e.event==='q_enter').map(e=>e.session_id));
  const submitSess=new Set(ev.filter(e=>e.event==='submit').map(e=>e.session_id));
  const artRows=Object.entries(art).map(([slug,a])=>{
    const p=POSTS.find(x=>x.slug===slug);
    const started=[...a.sess].filter(x=>startedSess.has(x)).length;
    const led=[...a.sess].filter(x=>submitSess.has(x)).length;
    return {slug,title:p?p.title:slug,v:a.sess.size,started,led,
      cvr:a.sess.size?(led/a.sess.size*100):0};
  }).sort((a,b)=>b.led-a.led||b.v-a.v);

  /* 실시간 — 최근 5분 */
  const live=new Set(EVENTS.filter(e=>Date.now()-new Date(e.created_at)<3e5&&!EXCL.has(e.session_id))
    .map(e=>e.session_id)).size;

  const table=(head,list,fmt)=>list.length?`<div class="tblwrap"><table style="min-width:420px">
    <thead><tr>${head.map(h=>`<th${h[1]?' class="num"':''}>${h[0]}</th>`).join('')}</tr></thead>
    <tbody>${list.map(fmt).join('')}</tbody></table></div>`:'<p class="hint">데이터 없음</p>';

  return `
  ${rangeBar(`<span class="tag ${live?'y':'n'}" style="align-self:center">지금 ${live}명</span>`)}
  <div class="kpis">
    <div class="kpi"><b>${tV}</b><span>오늘 방문 <em class="dl">${delta(tV,yV)}</em></span></div>
    <div class="kpi"><b>${tS}</b><span>오늘 순방문자 <em class="dl">${delta(tS,yS)}</em></span></div>
    <div class="kpi"><b>${tL}</b><span>오늘 리드 <em class="dl">${delta(tL,yL)}</em></span></div>
    <div class="kpi"><b>${S.length?(n/S.length*100).toFixed(1):'0.0'}<small style="font-size:.55em">%</small></b><span>전환율 (${rangeLabel()})</span></div>
  </div>
  <div class="kpis" style="margin-top:10px">
    <div class="kpi"><b>${S.length}</b><span>세션 (${rangeLabel()})</span></div>
    <div class="kpi"><b>${S.filter(x=>x.depth>=1).length}</b><span>진단 시작</span></div>
    <div class="kpi"><b>${S.filter(x=>x.depth>=3).length}</b><span>9문항 완주</span></div>
    <div class="kpi"><b>${n}</b><span>리드 · 누적 ${LEADS.length}건</span></div>
  </div>

  <div class="panel" style="margin-top:14px"><h3>일별 추이 <span class="lg">방문</span><span class="lg g">순방문자</span><span class="lg r">리드</span></h3>
    ${areaChart(days,['visits','sessions','leads'],['#3182F6','#10B981','#E5484D'])}</div>

  <div class="panel" style="margin-top:14px"><h3>시간대별 방문 (0~23시)</h3>
    ${barChart(hours,hours.map((_,i)=>i+'시'))}</div>

  <div class="split">
    <div class="panel"><h3>유입 채널 + 전환율</h3>
      ${table([['채널'],['세션',1],['리드',1],['전환율',1]],Object.entries(bySrc).sort((a,b)=>b[1].v-a[1].v),
        ([k,v])=>`<tr><td><span class="nm">${esc(k)}</span></td><td class="num">${v.v}</td>
          <td class="num">${v.l}</td><td class="num">${v.v?(v.l/v.v*100).toFixed(1)+'%':'-'}</td></tr>`)}</div>
    <div class="panel"><h3>기기</h3>
      ${table([['기기'],['세션',1]],grp(S,'device','미상'),
        ([k,v])=>`<tr><td><span class="nm">${esc(k)}</span></td><td class="num">${v}</td></tr>`)}</div>
    <div class="panel"><h3>캠페인</h3>
      ${table([['캠페인'],['세션',1]],grp(S,'camp','없음'),
        ([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`)}</div>
    <div class="panel"><h3>리드 처리 상태</h3>
      ${table([['상태'],['건수',1]],grp(rows,'status','new'),
        ([k,v])=>`<tr><td>${esc((ST.find(s=>s[0]===k)||[,k])[1])}</td><td class="num">${v}</td></tr>`)}</div>
  </div>

  <div class="panel" style="margin-top:14px"><h3>칼럼별 기여 — 어떤 글이 진단으로 데려오나</h3>
    ${artRows.length?table([['글'],['읽은 세션',1],['진단 시작',1],['리드',1],['전환율',1]],artRows,
      a=>`<tr><td><a href="https://bittalgil.com/#/columns/${esc(a.slug)}" target="_blank">${esc(a.title)}</a></td>
        <td class="num">${a.v}</td><td class="num">${a.started}</td>
        <td class="num"><b>${a.led}</b></td><td class="num">${a.cvr.toFixed(1)}%</td></tr>`)
      :'<p class="hint">아직 칼럼 경유 데이터가 없습니다. 글을 읽고 진단으로 넘어간 세션이 쌓이면 표시됩니다.</p>'}</div>`;
}

/* ══ 퍼널 ══ */
function funnelHTML(){
  const S=sessions();
  const HEAD='<h2 class="sect">퍼널</h2>';
  const top=S.length||1;
  const rows=STAGES.map((st,i)=>{
    const c=S.filter(x=>x.depth>=i).length;
    return {label:st[1],count:c,overall:c/top*100};
  });
  const qDrop=[];
  for(let q=1;q<=9;q++){
    const enter=S.filter(x=>x.maxQ>=q).length;
    const next=S.filter(x=>x.maxQ>=q+1).length;
    qDrop.push({q,enter,leave:enter-next});
  }
  const maxLeave=Math.max(1,...qDrop.map(d=>d.leave));
  return `
  <div class="panel" style="margin-top:14px"><h3>단계별 도달 · 이탈</h3>
    ${rows.map((r,i)=>{
      const prev=i?rows[i-1].count:r.count;
      const drop=prev-r.count;
      const stepRate=prev?(r.count/prev*100):100;
      return `<div class="bar">
        <div class="t" style="height:34px"><i style="width:${r.overall.toFixed(1)}%"></i>
          <em>${r.label} · ${r.count}명 · 전체 ${r.overall.toFixed(1)}%${i?' · 직전 단계 →'+stepRate.toFixed(1)+'%':''}</em></div>
        <span class="n" style="color:${drop>0?'var(--warn)':'var(--t4)'}">${i&&drop>0?'−'+drop:''}</span>
      </div>`}).join('')}
    <p class="hint">막대는 전체 방문 대비 비율입니다. 오른쪽 숫자는 직전 단계에서 빠져나간 사람입니다.</p>
  </div>
  <div class="panel" style="margin-top:14px"><h3>문항별 이탈</h3>
    ${qDrop.map(d=>`<div class="bar">
      <div class="t"><i style="width:${(d.leave/maxLeave*100).toFixed(1)}%;background:#E5484D;opacity:.8"></i>
        <em>${d.q}번 문항 · 진입 ${d.enter}명</em></div>
      <span class="n">${d.leave?'−'+d.leave:'0'}</span></div>`).join('')}
    <p class="hint">가장 긴 막대가 가장 많이 포기하는 문항입니다. 문항을 고칠 근거가 여기서 나옵니다.</p>
  </div>`;
}

    <thead><tr><th>접수</th><th>이름</th><th>연락처</th><th>경로</th><th>채무</th>
      <th>월 변제금</th><th>감액</th><th>요건</th><th>유입</th><th>상태</th><th>메모</th></tr></thead>
    <tbody>${rows.map(r=>{const c=r.calc||{};return `<tr data-id="${r.id}">
      <td class="num">${new Date(r.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
      <td><span class="nm">${esc(r.name)}</span></td>
      <td class="num"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
      <td>${r.form==='result'?'진단 완주':'상담 신청'}</td>
      <td class="num">${c.originalDebt?won(c.originalDebt)+'원':'-'}</td>
      <td class="num">${c.monthlyPayment?won(c.monthlyPayment)+'원':'-'}</td>
      <td class="num">${typeof c.reductionPercent==='number'?c.reductionPercent+'%':'-'}</td>
      <td>${r.eligible==null?'-':r.eligible?'<span class="tag y">충족</span>':'<span class="tag n">확인</span>'}</td>
      <td>${esc(r.utm_source||'직접')}</td>

        `<option value="${v}"${(r.status||'new')===v?' selected':''}>${l}</option>`).join('')}</select></td>
      <td><input class="memo" data-f="memo" value="${esc(r.memo||'')}" placeholder="메모"></td>
    </tr>`}).join('')}</tbody></table>`:'<p class="empty">해당 조건의 리드가 없습니다</p>'}</div>`;
}

function wireLeads(){
  const q=$('#q'); if(q)q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw();
    const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p);}};
  const fs=$('#fs'); if(fs)fs.onchange=()=>{FILTER=fs.value;draw();};
  const csv=$('#csv'); if(csv)csv.onclick=exportCSV;
  app.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id=tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el=>{
      const ev=el.tagName==='SELECT'?'change':'change';
      el.addEventListener(ev,async()=>{
        const patch={[el.dataset.f]:el.value};
        const {error}=await sb.from('bittalgil_leads').update(patch).eq('id',id);
        if(error){toast('저장 실패: '+error.message);return;}
        const row=LEADS.find(l=>l.id===id); if(row)Object.assign(row,patch);

      });
    });
  });
}

/* 방문 CSV — 세션 단위. 광고 대행사에 넘길 때 쓴다 */
function exportVisits(){
  const S=sessions();
  const head=['첫 접속','세션','머문 시간(초)','도달 단계','최대 문항','스크롤%','유입원','캠페인','기기','전화','카톡'];
  const body=S.map(x=>[new Date(x.first).toLocaleString('ko-KR'),x.id,x.sec,
    (STAGES[x.depth]||['','진입'])[1],x.maxQ,x.scroll,x.utm,x.camp,x.device,
    x.tel?'O':'',x.kakao?'O':'']);
  downloadCSV('빚탈길_방문',[head,...body]);
}
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${name}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

function exportCSV(){
  const rows=inRange();
  const head=['접수','이름','연락처','경로','채무','월변제금','감액률','요건','유입원','캠페인','기기','상태','메모'];
  const body=rows.map(r=>{const c=r.calc||{};return [
    new Date(r.created_at).toLocaleString('ko-KR'), r.name, r.phone,
    r.form==='result'?'진단 완주':'상담 신청',
    c.originalDebt||'', c.monthlyPayment||'', c.reductionPercent||'',
    r.eligible==null?'':r.eligible?'충족':'확인필요',
    r.utm_source||'', r.utm_campaign||'', r.device||'', r.status||'new', r.memo||''
  ]});
  downloadCSV('빚탈길_리드', [head, ...body]);
}

/* ══ 칼럼 ══ */
function postsHTML(){
  if(EDIT) return editorHTML();
  return `<div class="tools"><span class="sp"></span><button id="new">새 칼럼</button></div>
  <div class="plist">${POSTS.length?POSTS.map(p=>`<div class="prow" data-slug="${esc(p.slug)}">
    <b>${esc(p.title)}</b>
    <span class="meta">${esc(p.cat)} · ${p.read_min}분 · /${esc(p.slug)}</span>
    <span class="sp"></span>
    <span class="tag ${p.published?'y':'n'}">${p.published?'발행':'비공개'}</span>
    <button data-a="pub" class="${p.published?'':'pub'}">${p.published?'내리기':'발행'}</button>
    <button data-a="edit">편집</button>
  </div>`).join(''):'<p class="empty">칼럼이 없습니다</p>'}</div>`;
}

function editorHTML(){
  const p=EDIT;
  const body=(p.body||[]).map(b=>`${b[0]}\n${b[1]}`).join('\n\n');
  return `<div class="editor">
    <div class="row">
      <div><label>제목<input id="e_title" value="${esc(p.title)}"></label></div>
      <div><label>분류<input id="e_cat" value="${esc(p.cat)}"></label></div>
      <div><label>읽는 시간<input id="e_read" type="number" min="1" value="${p.read_min}"></label></div>
    </div>
    <label>주소(slug)<input id="e_slug" value="${esc(p.slug)}"${p.__new?'':' disabled'}></label>
    <p class="hint">사이트 주소가 됩니다 — /#/columns/<b>${esc(p.slug)||'주소'}</b>. 발행 뒤에는 바꾸지 않습니다.</p>
    <label>도입 문단<textarea id="e_lead">${esc(p.lead)}</textarea></label>
    <label>본문<textarea id="e_body" style="min-height:260px">${esc(body)}</textarea></label>
    <p class="hint">빈 줄로 단락을 나눕니다. 각 단락의 <b>첫 줄이 소제목</b>, 나머지가 본문입니다.</p>
    <label>인용 한 줄<input id="e_quote" value="${esc(p.quote||'')}"></label>
    <div class="acts">
      <button class="go" id="e_save">저장</button>
      <button id="e_cancel">취소</button>
      <span class="sp" style="flex:1"></span>
      ${p.__new?'':'<button class="danger" id="e_del">삭제</button>'}
    </div>
  </div>`;
}

function wirePosts(){
  const nb=$('#new');
  if(nb)nb.onclick=()=>{EDIT={__new:true,slug:'',cat:'제도 해설',title:'',read_min:5,
    lead:'',body:[],quote:'',published:false,sort:POSTS.length};draw();};
  app.querySelectorAll('.prow').forEach(row=>{
    const slug=row.dataset.slug, p=POSTS.find(x=>x.slug===slug);
    row.querySelector('[data-a="edit"]').onclick=()=>{EDIT={...p};draw();};
    row.querySelector('[data-a="pub"]').onclick=async()=>{
      const {error}=await sb.from('bittalgil_posts').update({published:!p.published}).eq('slug',slug);
      if(error){toast('실패: '+error.message);return;}
      p.published=!p.published; toast(p.published?'발행했습니다':'내렸습니다'); draw();
    };
  });
  const save=$('#e_save');
  if(save)save.onclick=async()=>{
    const slug=$('#e_slug').value.trim();
    if(!/^[a-z0-9-]{2,}$/.test(slug)){toast('주소는 영문 소문자·숫자·하이픈으로');return;}
    if(!$('#e_title').value.trim()){toast('제목을 입력해 주세요');return;}
    /* 빈 줄로 나눈 각 덩어리에서 첫 줄을 소제목으로 뗀다 */
    const body=$('#e_body').value.split(/\n\s*\n/).map(ch=>{
      const lines=ch.split('\n').filter(l=>l.trim());
      if(!lines.length)return null;
      return [lines[0].trim(), lines.slice(1).join(' ').trim()];
    }).filter(Boolean);
    const rec={slug,cat:$('#e_cat').value.trim()||'제도 해설',title:$('#e_title').value.trim(),
      read_min:+$('#e_read').value||5,lead:$('#e_lead').value.trim(),body,
      quote:$('#e_quote').value.trim()||null,published:EDIT.published,sort:EDIT.sort||0};
    const {error}=await sb.from('bittalgil_posts').upsert(rec);
    if(error){toast('저장 실패: '+error.message);return;}
    toast('저장했습니다'); EDIT=null; await loadPosts(); draw();
  };
  const cancel=$('#e_cancel'); if(cancel)cancel.onclick=()=>{EDIT=null;draw();};
  const del=$('#e_del');
  if(del)del.onclick=async()=>{
    if(!confirm('이 칼럼을 지웁니다. 되돌릴 수 없습니다.'))return;
    const {error}=await sb.from('bittalgil_posts').delete().eq('slug',EDIT.slug);
    if(error){toast('삭제 실패: '+error.message);return;}
    toast('삭제했습니다'); EDIT=null; await loadPosts(); draw();
  };
}

/* ══ 그리기 ══ */
function draw(){
  /* 한 페이지에 전부 쌓는다. 탭으로 나누면 무엇이 무엇 때문인지 안 보인다 */
  calcLive();
  shell(statsHTML()+funnelHTML()+journeyHTML()+adsHTML()+leadsHTML()+postsHTML());
  app.querySelectorAll('.range button[data-r]').forEach(b=>b.onclick=()=>{
    RANGE=+b.dataset.r; FROM=''; TO=''; draw();});
  const go=$('#d_go');
  if(go)go.onclick=()=>{const f=$('#d_from').value,t=$('#d_to').value;
    if(!f||!t){toast('시작일과 종료일을 모두 넣어 주세요');return;}
    FROM=f;TO=t;draw();};
  const cl=$('#d_clear'); if(cl)cl.onclick=()=>{FROM='';TO='';draw();};
  const bq=$('#botq'); if(bq)bq.onclick=()=>{NOBOT=!NOBOT;draw();};
  const ex=$('#exclr'); if(ex)ex.onclick=()=>{EXCL.clear();saveExcl();toast('제외 목록을 비웠습니다');draw();};
  const cv=$('#csv_v'); if(cv)cv.onclick=exportVisits;
  const cl2=$('#csv_l'); if(cl2)cl2.onclick=exportCSV;
  app.querySelectorAll('.range button[data-j]').forEach(b=>b.onclick=()=>{JMODE=b.dataset.j;draw();});
  wireLeads(); wirePosts(); wireAds();
  const jm=$('#jmore'); if(jm)jm.onclick=()=>{JMORE+=20;draw();};
  app.querySelectorAll('.jx').forEach(b=>b.onclick=()=>{
    EXCL.add(b.dataset.s); saveExcl(); toast('이 세션을 통계에서 뺐습니다'); draw();});
}

function wireAds(){
  const save=$('#sp_save');
  if(save)save.onclick=async()=>{
    const day=$('#sp_day').value, source=$('#sp_src').value.trim(), spend=+$('#sp_amt').value||0;
    if(!day||!source){toast('날짜와 유입원을 넣어 주세요');return;}
    const {error}=await sb.from('bittalgil_ad_spend')
      .upsert({day,source,spend},{onConflict:'day,source'});
    if(error){toast('저장 실패: '+error.message);return;}
    toast('저장했습니다'); await loadSpend(); draw();
  };
  app.querySelectorAll('.sp_del').forEach(b=>b.onclick=async()=>{
    const {error}=await sb.from('bittalgil_ad_spend').delete().eq('id',b.dataset.id);
    if(error){toast('삭제 실패');return;}
    await loadSpend(); draw();
  });
  app.querySelectorAll('.ucp').forEach(b=>b.onclick=()=>{
    navigator.clipboard&&navigator.clipboard.writeText(b.dataset.u)
      .then(()=>toast('복사했습니다'),()=>{});});
  const mk=$('#u_make');
  if(mk)mk.onclick=()=>{
    const q=new URLSearchParams();
    const src=$('#u_src').value.trim(); if(!src){toast('유입원을 넣어 주세요');return;}
    q.set('utm_source',src);
    if($('#u_med').value.trim())q.set('utm_medium',$('#u_med').value.trim());
    if($('#u_camp').value.trim())q.set('utm_campaign',$('#u_camp').value.trim());
    /* 쿼리는 해시보다 앞에 와야 한다 — 뒤에 붙이면 라우터가 경로로 읽는다 */
    const url='https://bittalgil.com/?'+q.toString();
    $('#u_out').textContent=url;
    navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>toast('복사했습니다'),()=>{});
  };
}

async function loadLeads(){
  const {data,error}=await sb.from('bittalgil_leads').select('*').order('created_at',{ascending:false});
  if(error){toast('리드를 못 읽었습니다: '+error.message);return;}
  LEADS=data||[];
}
/* 이벤트는 금방 수만 건이 된다. 화면이 보는 만큼만 가져온다 */
async function loadEvents(){
  const since=new Date(); since.setDate(since.getDate()-90);
  const {data,error}=await sb.from('bittalgil_events').select('*')
    .gte('created_at',since.toISOString()).order('created_at').limit(20000);
  if(error){toast('이벤트를 못 읽었습니다: '+error.message);return;}
  EVENTS=data||[];
}
async function loadSpend(){
  const {data,error}=await sb.from('bittalgil_ad_spend').select('*').order('day',{ascending:false});
  if(error)return; SPEND=data||[];
}
async function loadPosts(){
  const {data,error}=await sb.from('bittalgil_posts').select('*').order('sort');
  if(error){toast('칼럼을 못 읽었습니다: '+error.message);return;}
  POSTS=data||[];
}

async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session){renderLogin();return;}
  app.innerHTML='<div class="login"><div class="box"><h1>불러오는 중…</h1></div></div>';
  await Promise.all([loadLeads(),loadPosts(),loadEvents(),loadSpend()]);
  draw();
}
boot();
</script>
